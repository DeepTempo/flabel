  - "GOAL 5 IS PASSABLE BUT STILL NOT WIRED — the top open CI gap. Re-measured 2026-08-12 against a freshly built full-scale snapshot (8c9e8d58af0a8d64, 85,431 rules): the canary produces 0 detections, independently confirming the #42 fix. DECIDED (Craig, 2026-08-12, recorded on #24): wire it as a SCHEDULED feeds workflow, separate from PR CI, which fetches the nine feeds, builds a real snapshot and fails the build on any label. Rejected: caching a CI-built snapshot for the PR path (puts a network fetch in the PR critical path, and a cache miss silently skips the gate) and committing a reduced snapshot (a curated subset stops being the standing FP review for the 21,464 ungated pawpatrules rules, which is the whole point). Step 10 owns it; until it lands the review depends on someone remembering."
