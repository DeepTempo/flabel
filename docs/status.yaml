known_gaps:
  - "GOAL 5 IS PASSABLE BUT NOT WIRED. Measured 2026-08-12: the fixed canary produces 0 alerts against a real 85,431-rule snapshot (the old one produced exactly 1, pawpatrules 3300303). But no CI job runs the canary against a snapshot — the suite may not contact feeds and a 43 MB snapshot is not committable — so that proof is a manual run. Until step 10 wires it, the standing FP review depends on someone remembering. This is the top open CI gap."
  - "rules_failed threshold is approved in principle but UNIMPLEMENTED and unjustified. Step 6 hard-fails on any shortfall; at full scale the count is 0, so strict works. A threshold is a number of labels you are willing to lose in silence — do not invent one without evidence."
  - "Step 9 must decide where tool_failures[] is reported: spec §11 requires it recorded, §13 forbids a partial labels.json, so the array lives in the file that must not exist. Options are in PLAN step 9; the empty-labels[] option is the trap, since it reads as 'nothing malicious found'. Needs a real decision, not a default."
  - "RESOLVED 2026-08-12: the benign canary tripped pawpatrules 3300303: make_canary.py generates cleartext HTTP to port 443, which that rule legitimately flags. The fixture is at fault, not the feed — a canary whose whole point is that zero labels is known-correct must not contain anomalous traffic. Fixed in #42: flow 2 moved to port 80 and the fixture regenerated. The fixture was at fault, not the feed."
  - "Reproducibility has a shelf life: the apt repos serve only newest-patch, so Dockerfile.toolchain will eventually stop being rebuildable and the pinned toolchain survives only as the GHCR image pinned by digest in ci.yml. Decide before Step 10 wires the Goal 2 gate whether to mirror the .debs/image or accept the bound in writing."
  - "ci.yml's toolchain digest is updated by hand after the toolchain workflow publishes, so it can silently lag behind Dockerfile.toolchain — CI would keep running an older toolchain with every test passing, because the pins and the old image still agree. Known weak link, not an oversight."
  - "No LICENSE file. Deliberate (Craig's call, 2026-08-12) while JA4+ licensing is with Legal — the repo is public but unlicensed. Not a scaffold defect; do not re-flag."
  - "README §Status and §Output layout are stale: they say 'Pre-research', call labels.json 'unsettled', and describe replay-based detection, which is Phase 2. Its Develop section is current."
