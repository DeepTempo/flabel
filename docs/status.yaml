  - "2026-08-20 THE link_type 0 SENTINEL IS GONE AND THE `UNREACHABLE` BRANCH WAS NOT. 0 is DLT_NULL (BSD loopback), a VALID link type, so publishing it for `unknown` was indistinguishable from a real measurement in a provenance field. The review called the branch unreachable and a test proved otherwise — a pcapng with an IDB and no packets reaches it. So an empty capture is now refused right after the walk, BEFORE any tool runs, which the neighbouring comment already argued for one layer up, and both link-type lookups are guaranteed non-empty by that guard rather than by a sentinel"
  - "2026-08-20 THREE NO-GUARD GAPS CLOSED, all of the shape `the code could publish nothing and stay green`. link_type and snaplens are now asserted in a REAL labels.json — before that, _input_section could have published null for both on the SUCCESS path with the whole suite green, because the spec-10 test checks key PRESENCE only. provenance.KNOWN_TIERS is asserted IS models.KNOWN_TIERS (identity, not equality — re-inlining the tuple passed CI, which is exactly the drift the move was supposed to end). And TIERS_BY_MODE is linked to KNOWN_TIERS: spec-label-store 6.2 claimed to consolidate four places recording which tiers exist and had consolidated three"
  - "2026-08-20 FOURTH TIME IN ONE STEP A TEST WAS FOUND PASSING ON SOMETHING OTHER THAN WHAT IT NAMED, this one by sabotage: `stop excluding uri_status` PASSED because both documents in my canonical test said gs, so the exclusion was never exercised. The other three were the four threat-name fixtures at an impossible tier, LabelKind's untested guards, and the empty-item test that the SORTED guard caught first. The frequency is the finding — on this codebase a passing test adjacent to new work deserves active suspicion rather than a green tick"
  - "2026-08-20 /security-review COULD NOT RUN — it requires the cwd to be inside a git repository and this project's sessions run from inline-labeling, a sibling of the repo. Done by hand instead. JSON injection is NOT possible: json.dumps escapes control characters, so a newline or NUL in the URI cannot break the document or inject a sibling field, verified by round-trip. The IDB read widened from 2 to 8 bytes on ATTACKER-CONTROLLED capture bytes was probed with 4-byte, 2-byte and empty bodies: all give a clean CaptureError, no struct.error, because MIN_BODY_BYTES already specified 8 for an interface description block — luck rather than design, which is why it was probed. A hostile snaplens: [4294967295] is recorded verbatim, which is faithful reporting rather than a defect"
  - "2026-08-20 SCOPE, RECORDED RATHER THAN HIDDEN: four files outside LS-1's stated list were touched — correlate.py and test_correlate.py (the first review's HIGH 1), test_canonical.py (implied by the step's own two-origins test) and make_awkward.py (the disagreeing-snaplen fixture, without which HIGH 2 was untestable). The plan's file list is amended. ALSO SAID OUT LOUD: after LS-1, --source-uri exists and NOTHING PASSES IT — the headline requirement stays unmet in production until LS-5 wires the wrapper. LS-1 is a precondition, not the deliverable"
  - "2026-08-20 LS-3 BUILT AND MUST NOT MERGE (PR #157). CI IS GREEN — lint, test, Goal 5 gate, 1364 tests — AND BOTH OF ITS COMMANDS ARE BROKEN. That combination is the finding, and it is the CI-gap question Craig's standing orders ask for: nothing in the PR path executes the code where flabeldb meets BigQuery, so green CI is not evidence about the only two commands the step delivers"
  - "2026-08-20 LS-3 CRITICAL 1, verified against the installed library rather than reasoned about: BigQuery tables.get returns LEGACY type names. SchemaField.from_api_repr gives field_type INTEGER for INT64 and RECORD for STRUCT — the library ships LEGACY_TO_STANDARD_TYPES with 18 entries precisely because of this. So from_bigquery feeds differences() names that can never match the declaration: measured 3 phantom differences on `captures` alone from a CLEAN dataset, and a RECORD reaching Column.__post_init__ raises `only a STRUCT may carry subfields`, which exits 1 = EXIT_DRIFT — flabel-deploy would block every deploy while reporting a schema problem that does not exist"
  - "2026-08-20 WHY NEITHER MY TESTS NOR MY LIVE RUN CAUGHT CRITICAL 1, and this is the part worth carrying. Every verify test builds the LIVE side out of schema.TABLES, so it compares the declaration to a copy of itself — test_verify_is_silent_when_the_live_schema_matches is literally differences(TABLES) == () and CANNOT FAIL. And my live run against flabel_scratch exercised only the all-tables-missing path, because the dataset was empty; the MATCH path has never executed against BigQuery at all. Coverage said so plainly and I did not look: from_bigquery, to_bigquery, credentials, client, _apply and _show are all 0%"
  - "2026-08-20 LS-3 CRITICAL 2, verified in the library source: Client.create_table(exists_ok=True) DOES NOT PATCH. On Conflict it returns get_table, and update_table appears nowhere in the method. So after LS-6 provisions the dataset, apply prints a per-table success line and changes nothing while verify keeps reporting drift — a loop the operator cannot escape — and the subcommand help I wrote says `create or patch`. CRAIG'S DECISION: apply should PATCH WHAT IT CAN and say plainly what it cannot, since BigQuery permits additive changes and relaxations only and a narrowed type needs a table rebuild"
  - "2026-08-20 THE ALREADY-FIXED BUGS REACHABLE BY ANOTHER ROUTE. ReauthFailError is a RefreshError SUBCLASS, so the name-matching frozenset misses it — and it is the exact failure spec 7.1 quotes from the box (`Reauthentication failed. cannot prompt during non-interactive execution`), landing on exit 1 = EXIT_DRIFT, which is the bug the PR claims to have fixed. 15 google.auth exception classes are unmatched, and api_core wraps transport failures in RetryError. THE REAL DEFECT IS THE DEFAULT: main() re-raises anything unmatched and an unhandled exception exits 1, so the frozenset is an allowlist standing in front of a fall-through that is ALWAYS wrong. Needs EXIT_INTERNAL = 3 and isinstance against lazily-imported types"
  - "2026-08-20 AND THE SUITE IS RED ON A CHECKOUT WITHOUT THE db EXTRA, which is the state spec 7.5 exists to protect. importlib.util.find_spec on a dotted name IMPORTS THE PARENT and RAISES ModuleNotFoundError when it is absent — it does not return None — so collection errors instead of skipping, exactly the opposite of what the module's own docstring promises. Worse, this branch made --extra db unconditional in BOTH CI jobs, so CI can no longer notice. Needs the guard wrapped AND a CI job that syncs without the extra, or `flabel is installable with nothing` is a comment rather than a gate"
  - "2026-08-20 verify IS BLIND TO EVERYTHING EXCEPT COLUMN NAMES AND TYPES. It compares field lists only, so all of these verify CLEAN: a table with no partition or a spurious one; flow_labels clustered on zeek_uid, which is the store's single named never-do; clustering dropped so every query full-scans; every description wiped including the load-bearing `THE COMMIT MARKER`; and column ORDER reversed — measured, reversing all 13 columns of `runs` yields zero differences, which matters because BigQuery column order is physical. It also never checks the dataset's LOCATION, so the fact spec 10 measured hardest (us-central1, because job ids are namespaced by location and the bucket is regional) is unchecked by the command whose whole job is checking, and surfaces at LS-4's first load job instead"
  - "2026-08-20 THE VIEW TESTS GREP VOCABULARY, NOT BEHAVIOUR, and the review proved it by writing a view that inverts EVERY load-bearing decision — finished_at ASC so the OLDEST run wins, PARTITION BY dropping tier so one tier's run takes the whole capture, WHERE EXISTS instead of NOT EXISTS so it returns ONLY retracted runs, recency >= 1 so nothing is filtered — and all five committed assertions passed. The suite's own note that `a test that greps prose is a test that reports on prose` was the right insight applied one level too shallow: stripping comments fixed the false positive and left the tests still grepping. The plan's own stated behavioural test — two runs finishing in the same second, one excluded — was never written, and requires_bigquery is not even registered in pyproject markers while --strict-markers is on"
  - "2026-08-20 WHAT NO SABOTAGE COULD REACH, and it is the most security-relevant line in the diff: credentials() HAS NO TEST OF ANY KIND. Replace its body with google.auth.default() and all 1364 tests pass. That function IS spec invariant 7 (`the identity is named, never discovered`) and all of 7.1, and the failure it exists to prevent is that the day anyone runs gcloud auth application-default login on fl-replay, ingestion silently starts writing rows attributable to a person rather than the instance. Every test monkeypatches client.client wholesale so nothing ever calls it. Same shape: _apply and _show are entirely uncovered, and location=LOCATION can be dropped with the suite green because the test asserts the CONSTANT rather than that it ever reaches a client"
  - "2026-08-20 THE PATTERN TO CARRY INTO LS-4, stated by the reviewer better than I would have: the tests in this step cluster tightly around schema.differences() and the exit codes — the pure, easy-to-reach parts — AND STOP AT THE BOUNDARY WHERE THE CODE MEETS BIGQUERY. That boundary is where all four measured surprises in spec 10 lived, and it is where both Criticals live. Sixteen sabotages across LS-1 and ten here all went red, which says the guards that exist are held; it says nothing about the ones never written, and this step's uncovered surface is where they are"
  - "2026-08-20 LS-1 BUILT (PR #155), Phase 3a step 1 of 7. Four additive run.input fields — uri, uri_status, link_type, snaplen — plus models.LABEL_KINDS. THE REQUIREMENT WAS UNMEETABLE BEFORE THIS, not merely inconvenient: flabel-run stages a gs:// capture then assigns TARGET=$LOCAL, so run.input.path held the staged local path and the bucket URI was discarded with the shell variable. No amount of reading a run directory recovers it. None of the four bumps schema_version — additive, on #115's precedent"
  - "2026-08-20 uri_status EXISTS BECAUSE A NULL uri WOULD BE TWO FACTS. spec 10 is emphatic that null means not-measured, so without it `the operator passed a local path` and `this run predates the field` are the same value, in the one field the whole requirement depends on. The store reserves a third value, not-recorded, and only ingestion writes it. Related call: on a DEAD run all four are null INCLUDING uri, which the caller knows — following `path`, which is null there for the same reason, because the section's subject is the capture as handed over and a run that could not read it knows nothing about it"
  - "2026-08-20 link_type and snaplen are not cosmetic and the measurement is why: Zeek REFUSES a merged capture whose interfaces disagree on either (`an interface has a type 1 different from the type of the first interface`, `a snapshot length 262144 different from...`), so the future consolidator cannot group mergeable captures from discarded_link_types alone. snaplen takes the LARGEST where retained interfaces disagree — a mergecap pcapng carries one IDB per input file and they need not agree, so there is no single true value. Also: _emit_pcapng now RETURNS the retained link type rather than letting normalize re-derive it, because the selection rule (dominant by packet count, ties to the lowest type) must live in exactly one place"
  - "2026-08-20 canonical.EXCLUDED_INPUT_KEYS gains uri, beside path: the same capture staged from two buckets IS the same capture and sha256 says so, so without the exclusion Goal 2 fails on where the operator got the bytes — a false alarm about the pipeline. uri_status is deliberately NOT excluded, because gs-versus-local is a real difference in what was measured. --source-uri is VALIDATED and refused before any tool runs (a value that cannot be fetched is worse than none because it LOOKS like provenance, and on the replay box the alternative is finding the typo after a replay and a 60s settle); the empty string is refused explicitly because flabel-run will pass --source-uri '$MAYBE_URI'. What is NOT checked is whether the URI holds the hashed bytes — network I/O on a path 13 forbids it on — and a test asserts that NON-behaviour so it cannot be mistaken for a guarantee"
  - "2026-08-20 THE FRESH REVIEW OF PART A RETURNED THREE HIGHS AND ALL THREE WERE REAL. (1) The tier rule was enforced in TWO places in the change whose thesis is single authority: correlate hardcoded entry.tier == 1 and never read LABEL_KINDS, and the asymmetry was the danger — widening the table alone did nothing silently, while widening correlate alone made LabelEntry raise and took the run to exit 1 on a capture that had produced labels the day before. (2) The multi-arity guard ADMITTED WHAT IT EXISTED TO STOP: lists (mutable provenance), sets and generators (both fail inside labels.py AFTER the pipeline succeeded, and the guard's own all() exhausted the generator), empty items, unsorted and duplicated values. (3) The code and its own spec disagreed about where the check lives — I amended the SPEC, not the code, and named it as a completion with its cost"
  - "2026-08-20 THE REVIEW ANSWERED `WHAT WOULD A SEVENTH SABOTAGE FIND` WITH: NOTHING, AND HERE IS WHY THAT MATTERS. tiers=(3,) had IDENTICAL consequences to tiers=() — every entry of the kind unconstructible, surfacing as a confusing per-entry error rather than as the table being wrong — which is the empty-tiers guard's stated rationale word for word, and one raised while the other did not. Sabotage breaks guards that EXIST; it structurally cannot find one never written. That is the limit of the technique, stated plainly for the first time on this project"
  - "2026-08-20 THREE TIMES IN ONE STEP A TEST WAS FOUND PASSING ON A GUARD IT DID NOT NAME. (1) Enforcing LABEL_KINDS.tiers broke four existing tests that built LabelEntry(name=threat-name, tier=2) as incidental scaffolding, and one of them — the unknown-sid test — would have gone on passing while raising on the TIER. (2) LabelKind's empty-tiers and arity guards had no tests at all, because nothing in the codebase builds a bad kind. (3) My own empty-item test used ('T1190', '') which the SORTED guard catches first, so it passed without the empty-item check existing. Note the identical lesson is already recorded four lines away in test_models.py: `Hardcoding a sid made this hit the unknown-sid guard instead and pass for the wrong reason`. In this codebase a passing test NEAR A NEWLY ADDED GUARD deserves suspicion by default"
  - "2026-08-20 SMALL BUT WORTH CARRYING: `capinfos -s` is FILE size, not snapshot length — `-l` is. The oracle test failed on my wrong flag rather than on wrong code. And a commit chained `ruff check . | tail -2 && ...`, where the PIPE SWALLOWED the non-zero exit so the chain walked straight past a real lint failure — piping a linter into tail inside an && chain turns a gate into a no-op"
  - "2026-08-20 REVISION 2 of the Phase 3 spec and plan, after a fresh eng-reviewer read both documents and I then EXECUTED four of revision 1's BigQuery claims against the live service. Three were wrong, and spec 10 is a new section recording them so nobody re-derives them. The pattern is the one this repo keeps finding: the reasoning about docs/spec.md held up almost everywhere, and every failure clustered in claims about a service nobody had run a query against"
  - "2026-08-20 THE MEASUREMENT THAT REDESIGNED IDEMPOTENCY: a FAILED BigQuery load job burns its job id permanently. The repeat of a SUCCESSFUL job is refused as designed (Already Exists, row count unchanged), but a bad-row load left state DONE / errorResult invalid / outputRows None and the retry under the same id was ALSO refused. So jobId = ingest-run_id-table meant one transient failure permanently blocked a run — and combined with the commit-marker ordering, a half-loaded run was unrecoverable except by full rebuild, which makes revision 1's claim that re-running the same ingest completes it FALSE. Verified fix, run end to end: a runs-table query as the PRIMARY guard (also immune to the ~6-month job-id retention nobody can test), then DELETE the orphan rows, then reload under an attempt-numbered id"
  - "2026-08-20 TWO MORE BIGQUERY FACTS. PARTITION BY DATE(flow.ts_first) fails at CREATE TABLE — the field specified for partitioning can only be a top-level field — and a control partitioned on a top-level timestamp created fine, so it was the nesting not the syntax. Note my FIRST attempt at that test was invalid because `proto` is a reserved word in BigQuery DDL, and only the control failing identically revealed it. And job ids are namespaced project:location.jobid while the results bucket is US-CENTRAL1 REGIONAL, so the dataset location is pinned to us-central1 and is part of the idempotency namespace — revision 1 never stated a location at all"
  - "2026-08-20 THE objectViewer BLOCKER WAS NOT ONE — I asserted it from a partial memory of a grant instead of reading the grant, which is exactly the error the 2026-08-19 entry congratulates itself for avoiding. The SA already holds objectViewer alongside objectCreator on the results bucket, unconditionally, with no project-level storage role. Craig cannot impersonate that SA (no serviceAccountTokenCreator), so it was verified ON THE BOX — and that verification proved something more valuable: as the unprivileged user, the metadata server returned the instance SA and minted a token that read results/ with HTTP 200, while plain gcloud storage ls failed with Reauthentication failed and sudo gcloud worked. gcloud needs root because its credential store is PER-USER; a client library does not, because the metadata server is not user-scoped. So flabel-ingest needs no sudo, unlike every other cloud call in the wrapper"
  - "2026-08-20 CRAIG MOVED THE CROSS-TIER MERGE OUT OF SQL into blfile, using models.Label and models.verdict_entry. This deletes the current_labels view, the struct partition and the per-tier row split in one go, and replaces two implementations of the merge rule with one — in the language whose constructors already assert its invariants. It matters most because of #144: the cross-tier path has NEVER met real data (432/432 and 367/367 single-source), so writing it twice doubled untested logic. Cost accepted: merged labels are no longer queryable from the BigQuery console, only raw per-run rows. Side benefit that turned out to be the bigger one — the logic deciding what a label IS is now pure Python and runs in CI"
  - "2026-08-20 TWO OF MY OWN INVARIANTS COULD NEVER FIRE. (1) `only a delivered tier supersedes` was defined as tier not in tiers_unavailable — but spec 10 says tiers_unavailable is EMPTY ON EVERY SUCCESSFUL RUN and failed runs are never ingested, so delivered == attempted in every row that will ever exist. Worse, the hazard it was written for walks past it: #142's zero-rules-loaded run exits 0, publishes, reports tiers_unavailable [] and would have superseded good tier-2 knowledge with an empty result. Replaced with ATTESTATION from positive evidence — tier 2 counts only when counts.rules_loaded == ruleset.total_admitted. (2) LS-5's publish-on-exit-0 premise was FALSE: _write_output writes labels.json unconditionally on the success path and spec 13 says an all-IPsec capture exits 0 with labels[] empty, so a clean capture already publishes and already clears a stale tier. That bullet is deleted — it would have reversed the 2026-08-19 artifact decision, deleted a passing test, and destroyed the only unambiguous signal 2.5 has, because A TARBALL CARRIES NO EXIT CODE"
  - "2026-08-20 BIGQUERY TESTS WILL NOT RUN IN CI, decided rather than discovered (Craig). ci.yml has no GCP credential, the metadata server does not exist in GitHub Actions, and the repo is public so no key may be committed; Workload Identity Federation would fix it and was declined as out of scope. So flabel-db verify is a PRE-DEPLOY gate in tools/flabel-deploy and the definition of done says so, instead of claiming a CI gate that cannot exist. Same shape as the feeds.yml gap already recorded here — the honest version is naming what the gate does not cover"
  - "2026-08-20 PHASE 3 SPLIT into 3a (LS-1..LS-7: the store plus the origin URI, which is what Craig actually asked for) and 3b (LS-8 whole-archive backfill, LS-9 blfile reproduction). Revision 1 would have backfilled the entire archive BEFORE anyone had looked at a real row, which is when the attestation hole would have poisoned tier 2. Step ids and issues #145-#153 are unchanged — only the sequence moved. Two parallelism claims were wrong and the lesson is general: file-disjointness is NECESSARY BUT NOT SUFFICIENT. LS-2 ran uv sync --extra db before LS-3 created the extra; LS-4's real tests needed the dataset LS-6 provisions"
  - "2026-08-20 SMALLER REVISION-2 CORRECTIONS, each from the review and each a real defect. A retraction path (run_exclusions, append-only) because supersession orders on WALL CLOCK and spec 12 lets an operator pin an old --ruleset-snapshot, so a debugging run finishes later and would become authoritative — inverting the argument that justified supersession, with no way to undo it. uri_status, because a null uri meant BOTH not-applicable and not-recorded, which is precisely the conflation spec 10 calls 2.5's failure mode. ip_proto in the flow key, because spec 9 step 0 MEASURED ESP/SCTP writing identical 5-tuples with different uids, so without it two real flows collide into one. BigQuery IAM, which revision 1 omitted entirely while specifying GCS IAM carefully. And corrected file lists: the input block is built in provenance.py NOT labels.py, canonical.py needs input.uri in EXCLUDED_INPUT_KEYS or Goal 2 fails on a capture staged from two origins, and LABEL_KINDS JOINS the Literal rather than replacing it because static typing cannot come from a Mapping"
  - "2026-08-20 PHASE 3 PLANNED: the label store and blfile. docs/spec-label-store.md and docs/PLAN-label-store.md, 9 steps. It is a SEPARATE spec, not a section of docs/spec.md, because what it specifies lives in a separate package: flabel has dependencies = [] and test_architecture.py keeps a closed list of network modules, and a BigQuery client is both. Same argument that put the GCS upload in tools/flabel-run for #134, one layer out. Phase 1's stage rows and PLAN.md are untouched; Phase 2 never re-entered the pipeline at all so there was no precedent to copy"
  - "2026-08-20 THE MEASUREMENT THAT DECIDED THE KEY, and it invalidated the obvious design. Under zeek -D — which spec 2.3 makes MANDATORY — uids are POSITIONAL: a fixed sequence assigned in connection-creation order, so the Nth connection of ANY capture gets the Nth value. The 24h internet capture in inline-labeling/sample-run, a synthetic 2-flow lab pcap, and one benign-corpus fixture ALONE all report CJKFoj4bpHEhTeaRoj as flow 1. And the same flow 10.92.95.2:49161 -> 10.92.67.138:80 carried CRdT6w4PA64qWKmBk3 when second in a file and CJKFoj4bpHEhTeaRoj when first, ts_first 1693125635.672335 both times. So uid collides across captures AND is unstable for a given flow. The flow key is content-derived — (capture_sha256, proto, canonically ordered endpoint pair, ts_first) — and uid is stored as a per-run observation nothing joins on. Craig's instinct that the key must include the pcap identity is PROVED by this, not merely prudent"
  - "2026-08-20 THE REQUIREMENT WAS IMPOSSIBLE FROM TODAY'S OUTPUT and only reading the wrapper found it. Craig asked that every flow name the gs:// path of its origin capture. tools/flabel-run lines 211-220 stage a gs:// object and then assign TARGET=$LOCAL, so flabel is handed the staged local path and the bucket URI is discarded WITH THE SHELL VARIABLE — it exists nowhere in the run directory. Needs an additive run.input.uri from a new --source-uri flag, which is why LS-1 is the only step touching src/flabel and everything waits on it. Also found: ingest.py:255 unpacks _snaplen and throws it away, and only DISCARDED link types are published, never the retained one — both are what the future consolidator needs to know which captures are mergeable at all"
  - "2026-08-20 MERGE RULE IS SUPERSEDE-PER-TIER, UNION ACROSS TIERS (Craig). The newest run that DELIVERED tier T replaces all prior knowledge of tier T for that capture. Chosen over pure accumulation because feeds retract — 1,469 ET sids vanished in two days — and accumulation keeps a label no current run asserts inside a ground-truth dataset. Chosen over whole-capture latest-wins because bare flabel is tier 1 only and --offline is tier 2 only, so latest-wins would make a replay run DELETE every Suricata label. Two consequences worth knowing: it dissolved the cross-run threat-name problem entirely (a tier slice arrives whole from one run, so the threat-name is that run's own (unestablished, ts, sid) pick and a value matching no single run is unreachable), and it makes flow_labels one row per (run, flow, TIER) — a --both run puts both tiers on ONE Label, so storing that shape would make superseding tier 1 an array edit"
  - "2026-08-20 CRAIG CHOSE BIGQUERY OVER MY POSTGRES RECOMMENDATION, and the combination works better than I expected BECAUSE of the merge rule: supersession never updates a row, so the missing upsert stops mattering and the store is append-only with current as a view. What it costs is enforced uniqueness, so idempotency moves into the ingest path — content-derived run_id, jobId = ingest-run_id-table so the API rejects a double-ingest, and a duplicate-run_id assertion query as a STANDING GATE. That third guard is the one that matters: guards 1 and 2 are the mechanism, and this repo's recurring lesson is that a mechanism nothing asserts can be removed with everything still green"
  - "2026-08-20 THE VIEW NEEDED 138's OWN CORRECTION IN A SECOND PLACE. authoritative_runs orders by (finished_at DESC, run_id DESC), and the run_id half is required rather than cosmetic: finished_at alone is not a TOTAL order, and on a box that replays a whole capture in seconds two runs finishing in the same second is the ORDINARY case. Exactly the shape of #138's earliest-timestamp problem and #140's follow-on. LS-3 sabotages it by dropping run_id from the ORDER BY, because without a test the non-total order is invisible until two runs happen to tie"
  - "2026-08-20 CREDENTIAL IS NAMED, NEVER DISCOVERED, and the reasoning is a genuine asymmetry with #200 rather than a repeat of it. gcloud reads a PER-USER credential store, which is why every gcloud call in flabel-run had to be elevated. The Python client resolves ADC as GOOGLE_APPLICATION_CREDENTIALS then the user's application_default_credentials.json then the GCE METADATA SERVER, which is not user-scoped — so google.auth.default() would reach the instance SA today ONLY because that second file does not exist for that user, and the day anyone runs gcloud auth application-default login the ingest silently starts writing rows attributable to a person. So compute_engine.Credentials() explicitly, with --local-adc as a documented escape for laptops and tests. Consequence: ingest needs NO sudo, unlike everything else in the wrapper — it only reads run directories, which are root-owned but 0755"
  - "2026-08-20 A SECOND IAM BLOCKER FOUND BY READING THE GRANT, not by hitting the 403. Ingest reads the published tarball from gs:// rather than the local run directory, so that every ingested run is PROVABLY rebuildable and so live and backfill share one source. But roles/storage.objectCreator grants storage.objects.create ONLY — no get, no list — so the box cannot read back what it just uploaded. Needs roles/storage.objectViewer on gs://pm-proto-496816-flabel-pcaps, read-only, overwrite and delete still refused. LS-6 verifies it from the box in BOTH directions the way objectCreator was on 08-19, rather than inferring it from the role name"
  - "2026-08-20 --as-of FILTERS ON ingested_at, NEVER finished_at, and the intuitive choice breaks the whole reproduction argument. The Phase 3 backfill ingests old tarballs LATE, so a run finishing 2026-08-17 can carry an ingested_at of 2026-09-01 — filter on finished_at and a document rebuilt as of the 25th silently GAINS a run that was not in the store that day. Both clocks are needed and they do different jobs: ingested_at selects the candidate set, finished_at decides which candidate wins supersession. Also a correction of my own: I proposed this as byte-for-byte reproduction and that is unachievable because built_at is a wall clock. It is reproduction OVER RECORDS excluding built_at — the same error spec 10 already made and fixed for a run's output, where byte-identity was found wrong and unachievable"
  - "2026-08-20 THREE LONG-UNFILED THREADS FILED at Craig's request: #142 (fl-replay runs Suricata 7.0.3 against an 8.0 ruleset, and it is now the ONLY runner — so it gates tier-2 ingestion, because under supersede-per-tier those results would REPLACE good tier-2 knowledge rather than sit beside it), #143 (the unmatched-threshold denominator, with the three measured failures 1.37/2.03/1.34 percent and the source-port-reuse cause), #144 (multi-detection flows never seen in real data — 432/432 and 367/367 single-source — which the store sharpens because its merged view now recomputes best_tier in SQL as well as Python, so there are two implementations of a rule real data has never reached). Two EXISTING issues are also inherited: #60's rounded ts_last (the flow key uses ts_first so identity is safe, a consumer filtering the window is not) and #58's unbounded duplicate SourceEntry values, which the merged view's concatenated sources will surface"
