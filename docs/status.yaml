  - "2026-08-13 building the Goal 2 gate found FOUR things spec §10 had wrong, every one of which failed a real run before it was found — the same pattern as every other step. (1) §10 defined canonicalisation as dropping #-prefixed header lines and named reporter.log as canonicalised rather than excluded; measured on Zeek 8.0.4, a zeek_init message carries WALL-CLOCK time in the ts COLUMN, not a header, so two runs 1.4s apart differed after canonicalisation. Packet-time messages carry network time and are stable. The two are interleaved and indistinguishable from content, so the ts column goes. (2) §10 claimed alert and flow records are byte-stable: Suricata flow_id is per-run random (1464040180 vs 1271398021 for the same alert on the same packet). (3) flow.reason is a race — 14 runs gave 13x shutdown/shutdown and 1x shutdown/timeout, a ~7% flake rate, which is worse than always differing because it passes often enough to look sound then fails unreproducibly. (4) eve records arrive in different ORDER between runs, so a positional comparison reported four fields differing when nothing had changed"
