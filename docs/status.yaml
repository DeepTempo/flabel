  - "2026-08-19 spec §13 says never transmit capture data outside the run directory, and #134 transmits the run directory to a shared bucket. The rule HOLDS — the normalized pcap lives in a TemporaryDirectory and never enters the run directory, and the shipped suricata config writes no payloads or bodies — but §13 now states the scope explicitly, because what IS published is Zeek's logs: the DNS names, HTTP URIs and TLS server names of whoever is in the capture. Same content labels.json already published for a labelled flow, now for every flow. Publishing is a deliberate destination decision, which is why it is off when FLABEL_RESULTS_URI is empty"
