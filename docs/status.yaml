    - "CLEARED 2026-08-15 (#106). #90 — US-14's JA4 cross-check is a [CI] acceptance criterion that is unimplemented and has no field in spec §10. Zero impact today because no ja4.hash rules exist upstream (#13); latent the day content appears. RESOLUTION: deferred in writing in all four places the PRD claimed it (§6.2, §9, §6.6, §10 test matrix row 18), and recorded as a PRECONDITION for closing #13 rather than a dropped requirement."
    - "CLEARED 2026-08-15 (#106). #89 — PRD §6.6 lists classtype as REQUIRED where the code and spec §4 make it nullable, justified by 10,949 of 84,995 rules declaring none. So READ LITERALLY, GOAL 1 IS NOT MET. The decision is right; the PRD was never amended. RESOLUTION: PRD §6.6 amended, so Goal 1 is now met read literally. Goal 1's field list is also no longer hand-written — it is parsed from spec §4 at test time, the way §10 and §11 already were, and a second test asserts the spec and the code agree on which fields may be null."
    - "STILL OPEN. #94 — four of ten §11 loss conditions have no end-to-end fault injection. Every field is present and spec-parsed and the faults are asserted at stage level, but not through the assembled pipeline. The biggest coverage win left; two of the four have a real fault available for free (the ESP fixture, and the zero-packet capture as a genuine Suricata failure)."
    - "CLEARED 2026-08-15 (#107). #88 — Goal 5's REAL review runs only on a schedule GitHub disables after 60 days of repository quiet, and nothing fails if it stops. PRD §6.3 claims it runs on every build, which is true only of the narrow 3-rule canary. RESOLUTION: a feeds-liveness job in ci.yml, which runs on push and pull_request — a SCHEDULED liveness check for a scheduled workflow would inherit the identical 60-day disable. It fails a push when feeds has not SUCCEEDED within 7 days. The property is 'no change can merge while the standing review has been dark', not 'the review is running now', which nothing inside GitHub can assert about itself. PRD §6.3 now states the split as a table. Keyed on last success rather than last run, which the same day's outage proved necessary: a run that dies at line 1 is still a run."
  what_phase_1_actually_does:
    - "pcap in -> Zeek logs + labels.json of malicious-flow verdicts, each carrying tier, source, sid, rev, ruleset snapshot id, admission basis, licence, classtype and label_basis."
    - "Nine open-source rule feeds, content-addressed into an immutable snapshot: 115,991 fetched -> 84,995 admitted (73.3%) with exclude_classtypes in force."
    - "Reproducible over canonicalised records, gated in CI by a comparison proved able to fail."
    - "One label per flow, joined to Zeek by uid; identify-class sources can never label; a computed fingerprint is never a verdict."

