  - "2026-08-19 #136: flabel-run could not stage a gs:// capture from gs://tempo-datasets-002-north-south, and the honest diagnosis is not the one the 403 suggested. That bucket is in a DIFFERENT PROJECT (prod-loglm) and grants access only through that project's members, so the pm-proto instance service account got 403 — while the invoking user's gcloud on the box has NO CREDENTIAL AT ALL (craig@deeptempo.ai is the active account there but unauthenticated; his laptop is authenticated, the box is not). BOTH identities failed, for different reasons, and the pre-#134 code would have failed too with the less informative of the two messages. #134 changed which failure you see, not whether it works"
  - "2026-08-19 Craig granted the proto SA roles/storage.objectViewer on gs://tempo-datasets-002-north-south — a cross-project read into a production project, scoped to one bucket. VERIFIED BOTH WAYS from the box: the read succeeds (43.44MiB object listed) and a write is REFUSED for lack of storage.objects.create, so the lab VM cannot alter production data. It is the only option that makes unattended runs work; mirroring captures into the proto bucket and putting a human credential on a shared VM were the alternatives, and the second was rejected because a refresh token on a lab box outlives the session and is not attributable to a person acting"
  - "2026-08-19 the staging fetch now tries BOTH identities — service account first (durable, unattended, the identity grants are made to), the invoking user as fallback (for an object the operator can reach and the box has not been granted) — and on total failure prints both errors, both identities, and the three remedies. Safe because it is a READ: run.input.sha256 records the capture, not who fetched it, so which identity succeeded changes nothing a label asserts. The PUBLISH stays service-account-only, because what may be written and by whom is the entire point of the objectCreator grant"
  - "2026-08-19 one #136 sabotage passed and taught something: making stage_capture non-fatal still left the run un-started, because `[ -f \"$TARGET\" ]` further down catches it independently. The property was held twice; what is unique to the function is that the failure is fatal AT THE FETCH, so the operator reads the both-identities diagnosis and NOT a following 'no such capture' that reads like a missing file rather than a denied one. The test now pins that, and the sabotage goes red"
  - "2026-08-19 #138 built: labels[] replaced the top-level verdict, and threat-name joined it for inline runs. SCHEMA_VERSION IS NOW 2.0 — the first genuine break in this schema. Every earlier change kept 1.0 on an additivity argument (#115's new field, Phase 2's tier-1 sources entries, #132's widened run.mode which held because no existing document changed shape); none of those arguments survives removing a key, and a 1.0 consumer finds no verdict at all"
  - "2026-08-19 four #138 decisions are Craig's and two are worth re-reading before changing anything. (1) labels[] rather than a field per kind, because more label kinds are expected. (2) ONE threat-name per flow by tier precedence, which means tier 2's threat name is NOT promoted to a label when both tiers fire — it stays in sources[].threat, and the loss is deliberate: one trainable value per flow instead of a set the consumer must reduce. (3) omitted, not null, on a Suricata-only flow, which is what makes extending it to tier 2 additive. (4) earliest detection wins the tie"
  - "2026-08-19 I completed decision 4 rather than following it literally, and the distinction matters: `earliest timestamp` is NOT A TOTAL ORDER, so the comparator is (ts, sid) with sid breaking exact ties only. Without the second key the pick follows dict order — which is input order, which is not a property of the capture — and the label would differ between runs. Worth knowing: threat-name is tier-1 only, so on a replay-only run EVERY source is tier 1 and decision 2's tier precedence never fires; (ts, sid) IS the selection rule for the mode this label exists for"
  - "2026-08-19 verdict_entry() lives in models.py, not in correlate, for the reason models.label_basis does: A TEST THAT HAND-BUILDS A VERDICT ENTRY AGREES WITH ITSELF. Every verdict entry in the codebase, production and fixture alike, comes through one function, so a change to its shape cannot pass because the fixtures were updated to match"
  - "2026-08-19 THE SABOTAGE ROUND EARNED ITS KEEP AGAIN AND IN THE WORST WAY: SEVEN of the twelve #138 guards shipped in my first draft with NO TEST AT ALL — remove the check, suite stays green. Missing verdict, best_tier disagreeing with the verdict entry, repeated label name, unsorted labels, empty value, empty sids, unsorted sids. I wrote the guards and never wrote what proves them, and only breaking each on purpose found it. The tests exist now, and they came from breaking the code rather than from reading it, which is the wrong order"
  - "2026-08-19 best_tier STAYS at the top level (my call). It duplicates the verdict entry's tier by construction, and the repo's established answer to that is to ENFORCE agreement rather than remove one copy — the same thing Label.__post_init__ already does for min(sources.tier). Removing it would have been a bigger break than #138 asked for, and the PRD and spec both name it"
  - "2026-08-19 #140: the review of #139 found EIGHT things and I verified every one by hand before believing it. The worst was mine to own — spec §4 claimed (ts, sid) is what makes threat-name stable across runs, and for tier 1 the ts half is what makes it UNSTABLE. panw._receive_epoch parses receive_time with %Y/%m/%d %H:%M:%S — NO SUB-SECOND FIELD — off the device wall clock, and a whole capture replays in seconds, so two threats on one flow routinely share a timestamp. sid is what makes it stable, not ts. Not fixable in flabel: PAN-OS supplies seconds. Craig's decision stands; what changed is the claim made about it"
  - "2026-08-19 two bugs in the PROMOTION of Detection.threat, both harmless while that string sat in sources[] and neither harmless as a published label. (1) _receive_epoch returns 0.0 on a parse failure and 0.0 is the minimum of every real epoch, so ONE malformed receive_time made that entry the flow's threat-name — chosen for having failed to parse. Now sorted LAST via a leading (ts == 0.0) key, so it wins only when it is the only candidate. (2) panw substitutes the literal `unnamed` when PAN-OS sends no threat name, which published 'the device called this unnamed' in the one field the PRD calls the trainable value. Now omitted, which is Craig's own decision 3 applied to the same situation"
  - "2026-08-19 the missing guard: Label.__post_init__ validated the verdict entry thoroughly and the OTHER entries not at all, so a threat-name citing a sid no source carries — or a tier no source was reported at — serialised looking exactly as traceable as a real one. LabelEntry's own docstring claims it is where Goal 1 is carried for assertions narrower than sources[]; that claim had no guard behind it. Of #139's twelve guards seven were untested and fixed then; this was the one ABSENT rather than untested"
  - "2026-08-19 verdict.sids deduping across two sid namespaces was resolved as DOCUMENTATION, not a shape change. PANW threat ids and Suricata sids share no namespace, so a collision publishes one sid where two sources asserted — but nothing becomes untraceable, because sources[] still carries both in full. What was wrong was the implied reading that sids has one element per source. Carrying (source, sid) pairs would be a SECOND schema break for something no consumer has been misled by"
  - "2026-08-19 A SABOTAGE PASSED AND FOUND A REAL COUPLING HOLE: changing panw's placeholder literal from DEVICE_UNNAMED_THREAT to anything else left every test green while re-opening the bug #140 had just closed — because correlate filters on the constant and nothing asserted panw WRITES it. That is the exact drift a shared constant in models.py exists to prevent, and the constant alone does not prevent it; the test does. Same shape as the DEVICE_LICENCE arrangement, and worth remembering: putting a value in one place stops two copies, it does not stop one of them being ignored"
  - "2026-08-25 LS-7 built: the merge rule left SQL for src/flabeldb/merge.py, which is what spec-label-store \u00a75.2 means by ONE implementation. The dividend is the one the spec predicted — the rule that decides what a label IS is now ordinary pure Python, so 31 merge tests and 50 collection tests run in CI, where the requires_bigquery tests never do"
  - "2026-08-25 THE WORST LS-7 DEFECT, and the review found it rather than the tests: models.verdict_entry HARDCODES value='malicious', so blfile rebuilding the verdict from the surviving sources is a WRITE, not a read. A row storing any other verdict came out 'malicious' with nothing raised — a verdict no run asserted, published as ground truth, against \u00a713 and Goal 1. The cross-tier conflict guard could not catch it because it only compared stored entries WITH EACH OTHER, never with the value actually published. Reproduced by hand before I believed it"
  - "2026-08-25 the second half of the same defect, and the subtler one: every source on a flow asserts the verdict, so LabelEntry.tier on a verdict is a DERIVED min(sources.tier) rather than a claim of tier membership. A --both run stores its verdict at tier 1 even when the tier it still supplies is 2 — so tier-filtering that entry dropped it entirely, and the run shape \u00a75.2 rule 2 exists for had NO cross-tier value comparison at all. The verdict is now deliberately not tier-filtered, and the check runs against every contributing run"
  - "2026-08-25 TWO LS-7 DEFECTS CAME FROM RUNNING THE TOOL, NOT FROM READING IT — the #171 lesson applied on purpose. (1) --capture <name> was resolved to a digest in SQL and then re-filtered BY NAME downstream against the authoritative run's sighting alone; \u00a74.2's captures table is append-only so one capture legitimately carries several names, and asking for the name an older run saw returned an empty collection at exit 0. (2) _report, serialise and the write all sat OUTSIDE main's try/except, so a typo'd --output path escaped to the interpreter as exit 1 — the code blfile publishes as 'the store holds a disagreement'"
  - "2026-08-25 48 sabotages on LS-7, all red for the STATED reason, and six were green first. Four were escapes in the TESTS, not the code: the flow_key tie-break was unobservable because merge.compose already emits flows sorted by (capture, flow_key) and sort is stable; the --limit fixture ran flow_key and ts_first in the same direction; no ordering test ever used two captures, so capture_sha256 could be deleted from the sort key; and the UTF-8 assertion round-tripped through json.loads, which decodes \\u00f3 identically, so ensure_ascii=False was asserted by nothing"
  - "2026-08-25 ONE OF THOSE SIX WAS THE HARNESS, and it is worth knowing before the next sabotage round: CPython keys a .pyc on (mtime, size), so patching a file and restoring it inside one second can leave the previous bytecode in place. A sabotage that had genuinely broken the code reported STAYED GREEN. The harness now clears __pycache__ and runs with PYTHONDONTWRITEBYTECODE=1 — without that, a sabotage round can silently under-report"
  - "2026-08-25 coverage aggregation (Craig): \u00a76.4 says coverage is per CAPTURE, and a capture can be supplied by two runs. Quoting one of them would report unmatched:0 over a capture whose other tier left detections unplaced — the misreading \u00a74.4 stores unmatched to prevent, one level up. So unmatched is the sum, loss_conditions_fired the union of the TRUE flags (never the nulls), and unmatched_ratio is recomputed by models.CorrelationResult's own formula. NOT unmatched/detections: \u00a710 excludes unsupported-transport detections (#84), and a contributing run that never published that count silently reduced the ratio to exactly the forbidden division. A missing unmatched was null and loud; a missing unsupported was wrong and quiet"
  - "2026-08-25 \u00a79 asked LS-7 to decide DELIBERATELY whether a row it cannot construct is a hard failure or a counted exclusion. Decided: counted, on \u00a73.2's ip_proto precedent — refuse the flow, count it, name it. A historical row whose (kind, tier) pair falls outside today's LABEL_KINDS is data an older writer produced legally, and raising on it is how a backfill becomes unrunnable. Confirmed on real rows: the seam-test row in flabel_scratch left 6 of 11 sources fields null and was refused BY NAME rather than crashing the collection. LS-8 will meet more of those"
  - "2026-08-25 MergeConflict is not a ValueError so compose's refusal handler cannot swallow it — and the review found the same argument abandoned one level up, where blfile.main caught a bare ValueError as 'the store is inconsistent'. json.JSONDecodeError IS a ValueError, and so is every ordinary coding slip, so a bug in collection.build reported itself as a disagreement in the dataset. Now merge.StoreInconsistent, and a bare ValueError is exit 3"
  - "2026-08-25 blfile run against flabel_scratch on fl-replay, which is the part no test can do: the SQL executes, and authoritative_runs correctly superseded the older of TWO tier-2 runs on the same capture on real rows — \u00a75.1 supersession observed rather than fixtured. The #142 run with tiers_attested=[] was correctly absent. Real BigQuery types confirmed: flow.ts_first arrives as an aware datetime and round-trips to the same ISO string labels.json would write, labels[].value is a list even for a single-arity kind, snaplens is a real REPEATED field. The flabel dataset is STILL EMPTY"
  - "2026-08-25 \u00a76.4's example literal said snaplen (singular) while \u00a74.2, \u00a76.1 and the captures column are all plural — the SAME drift \u00a74.2 records being corrected once already at LS-3. Fixed with Craig's approval, along with three rules \u00a76.4 left to the implementer: origin resolves to the lowest authoritative tier that actually RECORDED one (a not-recorded sighting is an absence, not a disagreeing value, and every archived run predates --source-uri), coverage aggregates, and flows_without_origin counts the selection while flows counts what was emitted"
  - "2026-08-25 LS-8 built: tools/reconcile_store.py, read-only, SEPARATE from flabel-ingest --backfill on purpose. A tool that loaded the rows and then verified them would be checking its own work in the same process off the same parse — the shape tools/flabel-deploy already had to fix once, and what CLAUDE.md means by a gate placed after the merge not being a gate"
  - "2026-08-25 THE WORST LS-8 DEFECT WAS THE CHECK ITSELF, and the review found it rather than the tests. compare_run returned early on a missing runs marker, which put leg 2 — the archive against its own run.counts — behind 'the store has this run'. Every tarball was un-ingested the first time the tool ran, so leg 2 executed ZERO TIMES OUT OF 25 and the report's `0 [self-report]` meant NEVER CHECKED while reading as ALL 25 ARE CONSISTENT. The tests could not see it because the fixture counts were built to agree, so the leg was silent whether or not it ran. #171's shape exactly. Leg 1 still short-circuits on the marker; leg 2 never needed a store"
  - "2026-08-25 and I added a SECOND COPY OF ingest.RUN_COLUMN — the map whose own comment records that exact drift being MEASURED on 2026-08-24, when a run exited 3 having loaded nothing — inside a file whose new §8 argues against precisely that. captures names the run in observed_by_run_id and every other table in run_id. Now RUN_ID_COLUMN = ingest.RUN_COLUMN, and the test asserts identity rather than only the key set, which is what would have caught a wrong column"
  - "2026-08-25 three ways exit 1 could mean something other than 'the two sides disagree', all found by review: the pure half and the write sat outside every handler, a broken pipe from `| head`, and --local-adc raising DefaultCredentialsError — which derives from GoogleAuthError and NOT from RuntimeError, so the narrower except let it escape. Same discipline #157 arrived at for flabel-db, re-learned one tool over"
  - "2026-08-25 one unreadable object under the results prefix discarded the answers for all 24 other runs AND blamed the tool for it — the exact opposite of what ingest.backfill_over was written to do, and its docstring says why. select_tarballs matches anything ending .tar.gz, so a note in the prefix was enough to produce no report at all. Now a per-URI parse-failed finding: an object in the archive that nothing can parse is a fact about the archive, which is the tool's subject"
  - "2026-08-25 the #164 claim was overstated and the STRONGER case went unmentioned. identity.run_id hashes four fields — capture_sha256, mode, started_at, flabel_version — NOT the run block, and flabel_version is 0.0.0 and contributes nothing. So a replacement can rewrite counts, ruleset, tools, warnings and input.uri and keep the same id. When it does, leg 1 becomes a genuine CONTENT check: the store side is the old run's rows and the archive side is a fresh parse of the new tarball"
  - "2026-08-25 LEG 2 IS NOT TWO INDEPENDENT MEASUREMENTS OF THE CAPTURE, and I wrote that it was. cli.py builds counts.labels and labels[] from the same correlation.labels list in one process, so at labelling time they CANNOT disagree. What leg 2 actually catches is a document that changed after publication, and a flabeldb.parse that silently drops a label — which leg 1 structurally cannot, because leg 1 compares the store against that same parse. That second case is why both legs exist. Overstating what a check proves is the failure mode this repo exists to catch"
  - "2026-08-25 measured, all four the plan's named tests, on flabel_scratch: backfill 25 ingested / 0 failed / 1955 rows; reconcile exit 0 with BOTH legs on all 25; a second full backfill 0 ingested / 25 already present and 1955 rows unchanged; and counts.labels corrupted 338->339 on real run 1e1a1cf2cae41888 producing exactly one self-report. Refusals were 0 across the whole archive, which holds only because models.CORRELATABLE_PROTOCOLS equals identity.WRITABLE_PROTOS — two sets in two places that NOTHING pinned together before LS-8"
  - "2026-08-25 BOTH RECONCILIATION LEGS ARE CARDINALITY-ONLY and that is a deliberate limit, not an oversight. A load that silently CORRUPTED rows passes while the count matches. A TO_HEX(MD5(STRING_AGG(flow_key, '' ORDER BY flow_key))) beside the existing COUNT(*) would make it a content check in about ten lines; NOT done because LS-8's plan scopes the step to row counts (Craig, 2026-08-25), and recorded in docs/label-store-provision.md §8 so it is not re-derived. It belongs with LS-9, which is about reproduction"
  - "2026-08-25 reconcile is read-only so it cannot damage the store, but its ANSWER is not timeless and the doc claimed too much at first: the archive is listed and parsed minutes before the dataset is queried, so a run published and indexed inside that window has rows in the store, was not in the listing, and is reported as an orphan. Re-run before believing one"
  - "2026-08-25 THE flabel DATASET HOLDS PRODUCTION ROWS FOR THE FIRST TIME. Craig authorised the backfill after #175 was green. Pre-flight verify clean and all five tables at 0; then 25 ingested / 0 already present / 0 failed, 1955 rows, and reconcile_store exit 0 on both legs. Identical to the flabel_scratch rehearsal and to the projection from the parse, which is the point of having rehearsed it"
  - "2026-08-25 ONLY 408 OF 1870 flow_labels ROWS ARE SELECTABLE, and that is §5.1 working rather than a fault: 1462 belong to runs that are superseded or attest nothing. blfile emitted exactly 408 flows across 15 captures, which is the Python merge agreeing with an independent SQL count over authoritative_runs — two implementations of 'which rows count', one in each language, reaching the same number. That is the best cross-check available for LS-7 and it only became possible once real rows existed"
  - "2026-08-25 #142 OBSERVED ON PRODUCTION DATA rather than inferred. The archive is 24 replay runs plus exactly ONE --offline run, and that one attests nothing: its note reads 'tier 2 not attested: 84958 of 84960 admitted rules loaded'. --skip-tier 2 was belt-and-braces — §2.4's rule-count check suppressed it unaided. Consequence worth stating: the store holds NO tier-2 knowledge, so LS-7's cross-tier composition path still has only fixtures behind it (#144), and will until #142 is fixed"
  - "2026-08-25 7 of the 24 replay runs are SUPERSEDED — real supersession in production, on captures labelled more than once. CORRECTED from 8, which was 25-17 and counted every run supplying nothing: the extra one is the --offline run that attests NOTHING and was never a candidate, a different \u00a72.4 mechanism. And NO finished_at collision was observed, so \u00a74.6's run_id tie-break still has only fixtures behind it — this log already records that no behavioural test can catch a missing tie-break, which voids production supersession as evidence for it"
  - "2026-08-25 THE HEADLINE REQUIREMENT IS UNMET FOR EVERY ROW NOW IN THE STORE, and the tooling says so out loud instead of hiding it. Bare `blfile --dataset flabel` emits 0 flows and refuses 408 for want of a recorded origin: all 25 captures rows predate --source-uri and carry uri_status not-recorded. §6.4 working exactly as designed — the count is published either way, so this reads as a shortfall rather than as a corpus with nothing malicious in it. A capture labelled after LS-5 will carry its gs:// origin and need no flag"
  - "2026-08-25 a real coverage block from production: loss_conditions_fired [ja4_unavailable], unmatched 0, ratio 0.0, input_status complete. ja4_unavailable is correct rather than a defect — the ja4 Zeek package is in the CI container and not on fl-replay, so rows written here carry null ja4/ja4s meaning NOT COMPUTED rather than NO TLS, which is the distinction §11's row for it exists to keep"
  - "2026-08-25 LS-9 built: --rebuild and --as-of. THE HARD PART WAS --as-of WITHOUT A SECOND COPY OF THE SUPERSESSION RULE — a view takes no parameters and §6.5's cutoff filters ingested_at, so views/authoritative_runs.sql gained a header and an as-of placeholder and is rendered TWICE from the one file: the CREATE for flabel-db apply, a bare parameterised SELECT for blfile. One text rendered two ways cannot diverge; a second view could, which is what §4.6 records removing. The executed DDL is unchanged, so no apply against a live dataset was implied, and with the cutoff past every ingested_at the re-rendered SELECT returned exactly the view's 17 rows on production"
  - "2026-08-25 THE LS-9 CRITICAL, and only real composition could have exposed it. §6.5 says --rebuild takes 'the pinned run_id set' and IDS ALONE ARE NOT ENOUGH: the rebuild also needs each run's TIERS, and the only thing to recover them from — runs.tiers_attested — is what a run CLAIMED, not what it supplies. §5.2 rule 2 turns on exactly that difference. A --both run attesting [1,2] while supplying only tier 1 made the rebuild see two runs for one (capture,tier) and exit 1 naming authoritative_runs, a view that code path never queries, about a perfectly consistent store. EVERY CAPTURE RE-RUN AT ONE TIER WAS UN-REBUILDABLE. The document now records the authority itself (runs[].run_id, capture_sha256, supplies), which is what makes a rebuild a function of that document plus the store"
  - "2026-08-25 AND NOTHING EXERCISED collect_rebuild TO COMPLETION — every CLI-level reproduction test monkeypatched it away and the two that called it returned before composing anything. That is why the critical above AND the dropped-cutoff defect were both invisible. #171's shape for the third time this phase: the one path production takes was the one path no test ran. The fix is one fixture that answers from fakes so the whole path runs, plus variants for a partially superseded capture and an --as-of document"
  - "2026-08-25 an --as-of document could NEVER reproduce, and the message blamed the store. read_prior dropped the cutoff while comparable kept selection.as_of in the comparison, so the rebuild wrote as_of null against a document that said otherwise — one difference, exit 1, and the words 'the rows those runs hold have changed'. Nothing had changed. The stated reason for dropping it was also wrong: collect_rebuild never passes the cutoff to any query, because the authority is read from the document. §6.5 refuses --rebuild --as-of on the COMMAND LINE; that is not the same as forgetting what the document said"
  - "2026-08-25 A RETRACTED PIN IS NOW A HARD FAILURE, and I got this the wrong way round first. authoritative_runs anti-joins §4.5 so the ordinary read path never sees an excluded run — but --rebuild pins a set recorded BEFORE the exclusion, so it is the one path that can resurrect one. §4.5 is explicit that the table covers 'a capture that must come out for legal or customer-data reasons', so reproducing past it would re-publish exactly what somebody removed. Reproduction is an audit capability, retraction is a correction, and when they collide RETRACTION WINS. Checked before anything is composed, so nothing retracted is ever read into a record"
  - "2026-08-25 four smaller LS-9 findings, all from review: a valid-JSON-but-wrong-shaped --rebuild file reached the interpreter as exit 1 (eight shapes, incl. a NaN literal that json.loads accepts and serialise refuses) — the code reserved for a refusal about the store; run BLOCKS and record ORDER were never compared, so a run row rewritten by a re-ingest reported REPRODUCED, which is the scenario --rebuild audits; --limit 0 slipped the --rebuild refusal because 0 == False in Python; and a malformed --as-of reached BigQuery and came back as 'This is a DEFECT in blfile' at exit 3, for a typo"
  - "2026-08-25 collection_id DEFERRED (Craig). §6.3 promised it in a list and §6.5 — which the plan says holds the design — never mentions it, nor do any of LS-9's named tests. Building it means guessing which of three jobs it serves: a one-field reproduction check (digest the records), an unambiguous same-question-different-answer signal (digest the inputs), or a per-build handle. They are not interchangeable, and an inputs-only id has a genuinely dangerous property for ground truth — a stable name whose content silently changed. §6.2's precedent applies almost verbatim: the field is not invented yet. If it is built later, build BOTH digests"
  - "2026-08-25 the reproduction comparison excludes the selection OUTCOME counts, and the reason is measured: a --limit 20 document pins only the runs whose flows survived truncation while its flows_without_origin counted the whole pre-limit selection — 408 against 20 — so the count differs while every record matches. Costs no detection, because a changed flow count IS an added or removed record. It also compares the JSON VALUE, not the Python objects: dataclasses.asdict leaves sids a tuple and json.loads yields a list, and without canonicalising every record of every document differed on (40151,) != [40151]"
  - "2026-08-27 THE REVIEW GATE WAS NOT WHAT CLAUDE.md DESCRIBES, and Craig caught it by asking whether #177 had had a fresh-eyes review. It had had one — against a diff ~700 lines smaller than the PR, because 40% of the PR was the fixes that review produced. Every step this phase had the same shape: review, substantial fixes, PR, fixes unreviewed. #174 and #175 are MERGED with that gap; their post-review changes were smaller and more local, and the sabotage rounds plus production runs are the only evidence behind them"
  - "2026-08-27 LS-9 TOOK THREE REVIEW ROUNDS AND EACH FOUND DEFECTS IN THE PREVIOUS ROUND'S FIXES. Round 1: --rebuild recovered a run's tiers from tiers_attested, which is what a run CLAIMED and not what it supplies, so every capture re-run at one tier was un-rebuildable. Round 2, on the fixes: two blocking defects, one a RE-RUN of round 1's own finding in the same function (validation covering two of three pin fields, missing run_id). Round 3, on those fixes: the same shape a THIRD time — run_id and limit validated, selection.labels missed"
  - "2026-08-27 so the fourth fix was STRUCTURAL rather than a fourth field: collection.DOCUMENT_SHAPE declares every field a rebuild path reads, one walk checks it, and a test asserts the declaration covers every key build emits — the arrangement RUN_ID_COLUMN has against schema.TABLES. A field added without a spec is now a failing test. Note the meta-test beside it: the FIRST version of that coverage test could not fail, because it filtered the document's paths by the declaration before comparing, which is circular — it passed with two new fields added to build"
  - "2026-08-27 measured against the LIVE service rather than read off the docs, and it corrected the --as-of gate in BOTH directions: BigQuery REJECTS 2026-08-25T14:30 (seconds are not optional) and +99:99 (the offset was never range-checked), and ACCEPTS 2026-08-25T00:00:00-08 and a named zone. The two cases that mattered were not in the test, which is why the sabotages restoring those holes stayed green. A gate looser than the thing it guards is the same defect as no gate"
  - "2026-08-27 FOUR SQUASH-MERGE REBASES this phase (#173, #174, #175, #176), one per stacked branch. Recipe: PROVE `git diff --quiet <old-base> origin/main` first, then `git rebase --onto origin/main <old-base> <branch>` — git drops the duplicate itself. Two traps: GitHub reports CONFLICTING for a while after a force-push plus retarget even when the merge is clean (check with git merge-tree locally), and rebasing onto the WRONG base silently drops commits, so verify rev-list --left-right --count afterwards"
  - "2026-08-27 BIGQUERY METADATA IS EVENTUALLY CONSISTENT BEHIND DDL, and I caused a flaky live suite proving it: making a fixture function-scoped turned one table rebuild into five and produced five fixture errors in one run. Fixtures that only want an EMPTY table now use empty() (TRUNCATE); rebuild() (delete-and-recreate) is for tests whose subject is the table's shape. Two clean live runs since"
  - "2026-08-27 THE ZEEK PIN CAN NO LONGER BE SATISFIED and this is the shelf-life gap known_gaps predicted. Dockerfile.toolchain pins ZEEK_PACKAGE_VERSION=8.0.9-0; the security:zeek OBS repo now serves zeek-8.0 at 8.0.1-0 and unversioned zeek at 8.2.2-0, security:zeek:8.0 is a 404, the pinned GHCR image is PRIVATE (gh token scopes are gist/read:org/repo/workflow — no read:packages) and there is no docker or podman on fl-replay. Source v8.0.9 (6e96ac1) is reachable and needs cmake/bison/flex plus ~40-90 min on 4 cores"
  - "2026-08-27 AND THE ZEEK TARGET IS WORTH QUESTIONING BEFORE IT IS PURSUED: all 25 archived runs record tools.zeek 8.2.1, so the corpus AND the box are 8.2.1 and only the PIN says 8.0.9. Downgrading makes the box match a pin that matches neither the data nor a rebuildable source. Bumping the pin to 8.2.x aligns CI with both and is the only rebuildable option — it also admits the pin has already lost. Craig's decision; recorded so it is not re-derived"
  - "2026-08-27 ZEEK DECIDED: stay on 8.2.1, no downgrade (Craig). Closes the question, not the gap. The box and all 25 archived runs are 8.2.1 and agree; Dockerfile.toolchain still pins 8.0.9-0, which is now unobtainable from apt and matches nothing that exists — so the GHCR digest IS the pin and the Dockerfile line is documentation of a build nobody can reproduce. Left deliberately unowned and unfiled; bumping it to 8.2.x is the rebuildable fix, and it changes what CI tests against, so it is a change to make on purpose rather than in passing"
  - "2026-08-27 PHASE 3 COMPLETE — LS-9 merged as #177 and there is no LS-10. What the phase actually delivered is a store that is CORRECT and a corpus that is NOT YET FIT FOR IT, and the second half only became visible once real rows were in: bare blfile emits ZERO flows and refuses all 408 selectable ones for want of a recorded origin, because all 25 captures predate --source-uri; no tier-2 knowledge is selectable at all (#142); and 1462 of 1870 rows are superseded or unattested. The machinery is proven and the ground truth it was built to serve cannot be served from the data currently loaded. NOTE FOR WHOEVER SCOPES NEXT: there is NO PHASE 4 defined anywhere in this repo — the delivery phases are 1 (tier 2), 2 (tier 1) and 3 (the label store), and the term Phase 4 appears only in docs/RESUME-ls-9.md, where I coined it. Scoping it is real work and not a lookup"
  - "2026-08-27 PHASE 4 SCOPED AND PLANNED (docs/PLAN-phase-4.md), chosen by Craig from four candidates. The finding that picked it: the store is CORRECT and the corpus in it is NOT FIT FOR IT. Bare blfile emits ZERO flows, refusing all 408 selectable ones for want of a recorded origin, because all 25 capture sightings (17 distinct captures) are uri_status not-recorded and predate --source-uri. 24 of 25 runs are tier-1 replay runs that NEVER INVOKED SURICATA — tools.suricata is null in every one — and the single --offline run attested nothing (#142). So cross-tier composition has never run on real data (#144). One cause, three symptoms"
  - "2026-08-27 EVERY PHASE-4 PREREQUISITE WAS VERIFIED PRESENT BEFORE THE PLAN WAS WRITTEN, which is what makes it cheap. The captures are ALREADY IN GCS with gs:// URIs and the instance SA can read them, so origins cost nothing and no capture data moves anywhere new. All 17 captures the store knows are in that bucket AND 7 MORE HAVE NEVER BEEN LABELLED, so the corpus grows 17 -> 24 in the same pass. The tier-1 device answers on 443, so --both is viable"
  - "2026-08-27 SURICATA'S PIN IS OBTAINABLE, UNLIKE ZEEK'S — measured the same day the Zeek pin was found unsatisfiable, and the contrast is the useful part. The OISF stable PPA serves 1:8.0.6-0ubuntu0 for noble, character-for-character the string Dockerfile.toolchain pins, while apt alone tops out at 1:7.0.3-1build3 from noble/universe. So #142 aligns the box WITH CI rather than merely moving it forward, and #142 own scope says to record the route in the provisioning script rather than run it by hand — that is the difference between fixing this box and fixing the gap"
  - "2026-08-27 --both HAS NEVER RUN ON THIS BOX: of 48 local run directories, 46 are replay, 2 are offline, ZERO are --both. The mode the whole of Phase 4 depends on is unexercised in production, which is #171 shape exactly — a path production never took is where the defect lives. P4-3 exists only to run it ONCE by hand, on one capture, before 24 are attempted"
  - "2026-08-27 THE ja4 DECISION MUST BE TAKEN BEFORE THE RE-RUN, NOT AFTER. tools.ja4_status reads not-installed on fl-replay, so every stored ja4 is UNMEASURED rather than absent — a distinction the run block records deliberately and a consumer cannot recover later. The re-run replaces the authoritative rows for every capture, so doing it with ja4 still missing makes that hole the permanent state of the store. Dockerfile.toolchain pins the package by tag AND commit, so installing it is bounded. Craig decision; either answer is defensible, discovering it afterwards is not"
  - "2026-08-27 ja4 INSTALLED ON fl-replay at the pinned tag v0.18.8, which still resolves to the pinned commit 3ecddb5f — checked, because a moved tag silently changes JA4 values on published labels. Verified four ways (commit, zeek --parse-only exit 0, zkg list, flabel own probe returning present) and then where it actually counts: a real production capture produced a real fingerprint in ssl_json.log, the file zeek.py parses. Route recorded in phase-2-replay-box-provision.sh rather than left in a shell history. TWO RESIDUES: zeek.py leaves ja4_package_version None and lets provenance.py substitute it from /etc/flabel-toolchain.json, which exists only in the CI container, so box runs record present with NO version; and zkg list still fails for the unprivileged run user (wants write on its state dir), so the pin test skips locally. Neither affects labelling — the run path never calls zkg"
  - "2026-08-27 THE PHASE-4 REVIEW CHANGED THE ROUTE, and this is the finding of the session. The plan said --both on 24 captures. Spec 6.4 already anticipated the situation: origin resolves to the LOWEST AUTHORITATIVE TIER THAT ACTUALLY RECORDED ONE, so a tier-2-only run from gs:// records the origin, attests tier 2, and SUPERSEDES NOTHING — the existing tier-1 runs stay authoritative. It is also the only option that exercises the cross-tier MERGE rule: cli.py:835 correlates both tiers together in one run, so a --both run arrives as ONE flow_labels row and merge.py rule 2 is never taken. --both would have proven cross-tier CORRELATION while leaving cross-tier MERGE as untested as it is today, at the cost of superseding every tier-1 verdict in the store"
  - "2026-08-27 AND THE REVIEW WAS WRONG TWICE, which is why findings get verified. Its first BLOCKING said the 2 unloaded Suricata rules were DUPLICATE SIDS, so no version upgrade would fix them and P4-1 was built on sand — argued carefully from suricata.py, snapshot.py and attest.py, and refuted by ONE GREP of the engine own log: `2 rules were skipped because the running Suricata version 7.0.3 is less than 8.0.0`, with 0 rules failed. A version predicate. Its HIGH 4 said the provisioning script already installs ja4 so the box is out of compliance — it was reading the ja4 block I had added to that file THIRTY MINUTES EARLIER, uncommitted, in the same session. A reviewer reads the working tree, not the state you think it reviewed"
  - "2026-08-27 THE DIGEST TRIANGLE IS GREEN BUT THE CODE PATH IS NOT: flabel-run:290 short-circuits on `[ -f $LOCAL ]` and reuses an already-staged capture WITH NO DIGEST CHECK, while --source-uri is set from the gs:// argument regardless — so a stale local copy would publish an origin the bytes did not come from, which is the top guardrail. Measured across all 17: bucket == local == the store capture_sha256, identical. So it is latent, not live. Kept as a P4-0 pre-flight and an issue rather than a blocker"
  - "2026-08-27 THE 7 NEVER-LABELLED CAPTURES ARE NOT FREE, and the measurement that said they were could not have seen otherwise: it counted run directories CONTAINING A labels.json, and a failed run writes run.json and no labels.json. There are 2 such dirs — capture_2026-07-21 attempted twice on 2026-08-20, both times tcpprep fatal, `packet capture length 43 too small to process`. tcpprep is TIER-1 ONLY, so the --offline route may well succeed where replay failed. Run the 7 AFTER the 17 so a surprise among them cannot be confused with a problem in the part that matters"
  - "2026-08-27 P4-1 DONE — SURICATA 8.0.6 IS ON fl-replay, from ppa:oisf/suricata-stable, version-pinned AND apt-mark held so an unattended upgrade cannot move the engine underneath a corpus already labelled with it. #142 is fixed and every part of its definition of done was MEASURED: the snapshot now loads 84960 of 84960 (0 failed, 0 skipped, was 84958/2); counts.rules_loaded == ruleset.total_admitted so §2.4 ATTESTS TIER 2 for the first time; the reproducibility suite is STABLY green, 7 passed on three consecutive runs, where #142 recorded it flapping 1-3 failures under 7.0.3; and the benign canary still produces 0 alerts and 0 labels. The whole suite went from 9 failures to 3"
  - "2026-08-27 TWO SNAGS IN THE SURICATA UPGRADE, both recorded in the provisioning script rather than in a shell history. First, dpkg refused the install: the OISF package BUNDLES /usr/bin/suricata-update and Ubuntu ships it as a separate package, so the standalone one has to be removed first — safe, because nothing in flabel calls it (rules/{fetch,admit,snapshot} do that job) and its only reverse-dependency was Ubuntu own suricata. Second, the OISF package installs /etc/suricata as 0750 suricata:suricata where Ubuntu had it world-readable, and Suricata resolves reference-config-file and threshold-config against that directory EVEN WHEN flabel own config declines to name them — so every run log filled with `Error: reference-config: Permission denied`. Harmless to label content (flabel measured the reference config as changing the load by 0 rules) but it failed the test that asserts the engine parses our config cleanly. NOTE THE CI BLIND SPOT: the container runs as root, so root can read a 0750 dir and CI could never have seen this"
  - "2026-08-27 P4-0 DONE. The BASELINE is built and deliberately NOT in the repo — /var/lib/flabel/phase4/baseline-20260827.json plus baseline-counts.csv — because a labels-collection carries capture-derived addresses and this is a public repo. It records 408 flows over 15 captures (not 17: two known captures have no verdict labels), 15 runs pinned, and every one of the 408 records at uri_status not-recorded, which is the exact thing P4-4 has to flip. One capture supplies 352 of the 408. THE DIGEST TRIANGLE IS GREEN across all 17 — bucket == local staging == the store capture_sha256 — so #179 is latent rather than live. Re-check it immediately before P4-4 rather than trusting this line"
  - "2026-08-27 #179 FILED: flabel-run reuses an already-staged capture on FILENAME ALONE, with no digest check, while still asserting the gs:// origin from the original argument. Spec §6.1 says the field records what the operator asserted, which is fair when the tool fetches; it stops being fair when the tool DECLINES to fetch and records the assertion anyway. §3.1 already says two files sharing a name may hold different bytes. Latent today, and load-bearing in P4-4, which is the one operation where a wrong origin gets written into production ground truth as the intended outcome"
  - "2026-08-27 THE RULESET SNAPSHOT IS A DECISION STILL OPEN, and it decides what the whole new corpus says. The box holds exactly ONE snapshot, b8b1e00ed2285240, fetched 2026-08-17 and now 10 days old; --ruleset-snapshot defaults to newest-available, so a rules update mid-batch would split the corpus across two rulesets with nothing recording it. P4-1 was verified against b8b1e00 deliberately, to isolate the Suricata variable. Before P4-4: decide whether to flabel rules update first, then pass ONE explicit snapshot id on every run. Recommended order — update, re-verify N of N on the new snapshot, then run the corpus — since §5.1 own justification for supersession is that feeds retract"
  - "2026-08-27 WIRESHARK 4.6.6 PINNED AND HELD, from ppa:wireshark-dev/stable — the same shape of fix as #142 and the same PPA route Dockerfile.toolchain already uses. It matters more than a version number: EDITCAP PERFORMS CAPTURE NORMALISATION, so 4.2.2 on the box meant the corpus would have been produced by a normaliser CI does not test. THE BOX SUITE IS NOW DOWN TO ONE FAILURE, the zeek pin Craig decided to leave — from 9 at the start of the day"
  - "2026-08-27 FRESH RULESET SNAPSHOT 682c24ae30631504 FETCHED AND VERIFIED, and the delta is the argument for having fetched it: 83964 rules against b8b1e00 84960, so 996 FEWER over ten days. That is exactly the feed retraction §5.1 cites as the reason supersession exists, observed rather than quoted. Verified before committing the corpus to it: 83964 of 83964 loaded, 0 failed, 0 skipped, attests tier 2, and the benign canary still yields 0 labels. PIN THIS ID EXPLICITLY on every P4-3 and P4-4 run — --ruleset-snapshot defaults to newest-available, so an unpinned batch would silently split across two rulesets if anyone ran rules update mid-way"
  - "2026-08-27 THE DEPLOYED CLONE WAS 6 COMMITS BEHIND AND ITS OWN rev-list SAID ZERO, because /opt/flabel/repo had not fetched — `git rev-list --count HEAD..origin/main` measured against a STALE REMOTE REF and answered 0. This is the LS-2 finding recurring in a subtler form: last time the clone was visibly 12 behind, this time it CLAIMED to be current. Always fetch before measuring how far behind a clone is; the number is otherwise about the last fetch, not about main"
