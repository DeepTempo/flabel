known_gaps:
  - "#117 IS THE THIRD FIX TO ONE FEED AND THE MEASUREMENT SAYS IT IS THE LAST ONE WORTH MAKING AT THIS LAYER. Excluding the five observational markers removes 17 of 338 corpus entries for 445 of 21,467 rules. WHAT SURVIVES EVERY VARIANT OF THAT POLICY, measured across all 22 captures: sid 3321483 VxWorks WDB version check x158 on 21 captures, sid 3321488 VxWorks DOS x49, sid 3319964 Conti x43, and two Log4Shell address rules x3 — all carrying the feed's own DETECTION markers, and 46 of them already filterable via #115's direction field. So 80% of pawpatrules' output is unreachable by any feed-level taxonomy fix, and the honest description of it is not 'false positive' but 'correct observation of inbound scanning'. THE OPEN QUESTION IS THEREFORE #118's POLICY HALF, not another admission mechanism: whether a refused scan is a malicious FLOW depends on whether the labels train 'this host is being attacked' or 'this host is compromised', and those are different products. Note pawpatrules' 9,669 detection-marked rules have still never had a chance to fire, because nothing on this host is compromised — a capture from a host Craig suspects would test the other half, and I would want that before anyone recommends dropping the feed."
  - "KEYING A POLICY ON AN EMOJI CONVENTION: WHAT MAKES IT DEFENSIBLE, AND THE TWO WAYS IT NEARLY WAS NOT. #113 rejected this explicitly ('a msg-text convention is not an interface') and that objection still stands; what answers it is tests/integration/marker_gate.py, which fails the SCHEDULED feeds build if the marker vanishes, if the count leaves its band either way, or if a marker nobody has classified appears on an admitted rule. IT FOUND A REAL PARSER DEFECT ON ITS FIRST RUN against the live feed — twelve phishing rules write the brand prefix with no space after the dash and the parse reported the paw print itself as their marker. No synthetic fixture had that shape. TWO MORE FOUND IN REVIEW, both silent re-admissions: the brand was INFERRED from shape (any marker followed by a dash), so an observational rule written without the brand reported no marker and was admitted; and a non-pictograph could be a marker, so a French rule title returned É and a non-breaking space returned \xa0. THE UNICODE TRAP WORTH CARRYING: ℹ is category Ll, a LETTER, because it derives from an italic i — a reviewer recommended a bare category==So test and it would have rejected the one marker #113 and #117 both depend on."
  - "A REPRODUCER THAT COULD NOT REPRODUCE, found in the #117 review and worth knowing about the others. tests/fixtures/rules/measure_feeds.py is named in spec §6 as how every admission measurement is checked offline, and it called load_admission_policy — the GLOBAL table — so it applied neither #113's classtype policy nor #117's markers. Every number it printed for pawpatrules had been wrong since 2026-08-16, and its §6 identity assert omitted the new counter so fixing the first alone would have broken it. Its table also had no column for either exclusion: 985 of pawpatrules' 988 excluded rules appeared nowhere in the output. THE GENERAL POINT: this repo treats 'a measurement that cannot be re-run is a claim', and the script that makes them re-runnable had itself drifted from the product. It has no test — that is still true, and it is the 2026-08-15 known gap that has now caused a second problem."
  - "WHAT #115 COST AND WHAT IT DID NOT, since the issue predicted only the cheap half. The parse itself was one field. The two real findings came from building it. (1) A REPRODUCIBILITY HAZARD THE FIELD CREATES: before it, one rule matching both halves of a flow produced two IDENTICAL SourceEntries, so their order could not be observed; carrying direction makes them different records, and an unbroken tie would let two runs over one capture write them in either order. Fixed by adding direction to BOTH sort keys — correlate._source_order and labels._entry_key, which must agree and now have a test saying so. MEASURED AND WORTH KEEPING: the Goal 2 gate does NOT catch that drift. Dropping direction from both keys leaves all seven reproducibility tests green, because Suricata emits alerts in packet order under --runmode single and the tie breaks identically in both runs. The hazard is latent, the unit tests hold it, and tests/integration/conftest.py says so in writing rather than implying the gate covers it. (2) THE FRAME OF REFERENCE IS SURICATA'S FLOW, NOT ZEEK'S. direction is published on a SourceEntry that carries no tuple of its own, beside a Label naming a Zeek flow, so every consumer will read to_client as 'from flow.dst_ip to flow.src_ip' — true only while the two engines agree on who initiated, which spec §9 explicitly does not require (it matches in either direction). Documented in spec §4 and models.py. NOT MEASURED, and the honest gap: whether they ever actually disagree on a real capture. A midstream pickup or a UDP flow one engine has expired and the other has not are the candidates. That spike is unrun."
  - "SUPERSEDED by the 2026-08-17 handoff above; kept for the backlog grouping it records. SESSION HANDOFF 2026-08-15. main is 4f29b81, clean, NO open PRs, 1007 passed / 5 skipped locally, CI green on main including the new feeds-liveness job. NOTHING IS IN FLIGHT. THE 13 REMAINING ISSUES, by what they threaten: LABEL QUALITY — #77 (directionality, the largest remaining, but see the reframing below), #34, #96, #60, #58, #48. GOALS FORMALLY UNMET — #103 (malicious canary, Goal 5 sensitivity), #94 (4 of 10 loss conditions lack e2e faults). TEST DEBT — #63. HYGIENE — #72, #61. RESEARCH/DEFERRED — #13 (no JA4 content exists upstream; a watch item, not work), #10 (recommended CLOSE as won't-do — the research is done, the coverage gain is 41.0% -> 52.3% on ET Open, and it buys it by lowering the trust bar on the largest feed six weeks after #75 showed what that costs). Phase 2 (PANW) is unstarted and CLAUDE.md says do not plan it before the reachability spike, PRD §13 Q16."
  - "THE FEEDS WORKFLOW WAS DEAD FOR A DAY AND THE CAUSE IS WORTH KEEPING. Step 11d (#101) added `set -euo pipefail` to two feeds.yml steps on 2026-08-14. GitHub defaults a CONTAINER job's steps to `sh -e {0}`, not `bash -e {0}`, and Ubuntu's /bin/sh is dash, which has no `pipefail` — so the first scheduled run after it merged (2026-08-15 04:28Z) died at line 1 with `Illegal option -o pipefail`, exit 2. The canary never reached its verdict and THE CORPUS GATE — 11d's entire deliverable — NEVER RAN ONCE. Fixed in #107 with a workflow-level `defaults.run.shell: bash`. WHY CI COULD NOT CATCH IT: nothing in the PR path executes feeds.yml, and a workflow's own shell is not something a test can reach. That gap is now closed by the ci.yml feeds-liveness job. Two things this proved rather than assumed: the issue-filing path WORKS (it opened #105 within two minutes, so the hole was never 'failures go unreported' — it is that a DISABLED workflow produces no run, no failure and no issue), and the corpus residue is stable across a third snapshot (17 captures, 12 labels, 21 entries, the same three sids in the same 19/1/1 proportions, measured 2026-08-15 by workflow_dispatch on the fix branch). That third sample is better evidence than the two 11d's own review called oversold."
  - "#77's 61% IS A DENOMINATOR, NOT A DEFECT RATE — read this before costing it. 61.3% (52,409 of 85,431) is the population of rules whose headers collapse to `any -> any`. The measured consequence on real traffic is ONE source entry: sid 3300140, one of the 21 in tests/fixtures/benign-corpus/tolerated.json, and pinned there since 11d so a directionality regression fails the gate today. Unknown rate, one observed instance, and a standing gate. Of the four options on the issue, 1 and 2 are out (an inference that is wrong silently loses rules — the §2.5 failure; the CLI contract is closed) and 3 is too expensive to ship (two Suricata passes every run). Option 4 — record the fired rule's directionality on each SourceEntry — is the right one and is cheaper than the issue implies, because 11c already built the machinery for composing a per-rule classification into a SourceEntry and the rule text is already parsed inside the hashed snapshot. Real cost is a sid_index schema bump, i.e. one `flabel rules update`. BUT MEASURE FIRST, and option 3's mechanism is how: run the 17-capture corpus twice per capture — once at HOME_NET: any, once with HOME_NET set to the RFC1918 space actually present — and diff the alert sets. The delta IS 'alerts that exist only because directionality was removed'. That gets option 3's information without option 3's runtime, and nothing has to ship an inference. If the number is 1, close #77 citing the tolerated entry. NOTE the experiment depends on the feed mirror, which has no backup."
  - "#103 HAS A ROUTE NOBODY HAS TRIED: DO NOT COMMIT THE CAPTURE — FETCH IT. tests/fixtures/README.md's criterion 1 demands 'a licence permitting redistribution in a public repo' and criterion 3 says the fixture is 'fetched on every scheduled run', which quietly assumes it is committed. Those are in tension. feeds.yml already makes nine network fetches; a malicious canary DOWNLOADED at run time from its publisher and pinned by sha256 is consumption, not redistribution, and the bar drops from 'redistributable' to 'downloadable and stably hosted' — which admits malware-traffic-analysis.net and others that criterion 1 rules out. What does NOT relax: no real personal data, and a named expected sid. New failure mode is upstream link rot, which fails a scheduled gate loudly and is acceptable there. SEPARATELY AND WORTH DOING EITHER WAY: a synthesized smoke control against one stable admitted sid retires the actual operational risk (the pipeline silently stops labelling and every gate passes) without proving sensitivity on realistic traffic. Take that, but do not let it quietly become the answer — Goal 5's sensitivity half stays unmet and #103 stays open until a real capture lands."
  - "TWO GAPS FOUND ON 2026-08-15 THAT ARE NOT FILED AS ISSUES. (1) tests/fixtures/rules/measure_feeds.py HAS NO TEST COVERAGE, and it is how every published measurement in this repo is reproduced. It broke silently when #91 changed load_snapshot's return arity; it was caught by importing the module by hand, not by the suite. A measurement script nothing exercises is a claim. (2) tests/test_cli.py IS A COLLISION SITE. Four PRs on 2026-08-15 all appended test blocks to the end of that one file, which caused all three merge conflicts of the day — and one of them spliced two unrelated tests together where git matched a shared `document = json.loads(...)` line, in a way a careless resolution would have shipped. If parallel work resumes, either split that file or insert near the code under test rather than at the bottom."
  - "SESSION HANDOFF 2026-08-17 — READ THIS FIRST. main is 3542385, clean. ONE PR OPEN: #116 (triage runs from a capture directory), MERGEABLE and green, merge it first or the batch commands do not work from outside the checkout. 1053 passed / 5 skipped. 17 open issues. PHASE 2 IS STARTING ON A SEPARATE BRANCH (Craig, 2026-08-17) — treat main as Phase 1 maintenance and do not mix the two. WHAT CHANGED TODAY: twenty-two real internet-facing captures were labelled for the first time, which found three false-positive classes and answered one open question by measurement. #113 fixed and merged (scanner identification). #115 filed (direction), #117 filed (observational rules), #119 and #120 filed (test gaps), #118 filed AND CLOSED as answered. tools/triage.py is new and is how a batch is run. START WITH #115."
  - "THE TWENTY-TWO CAPTURE CORPUS, AND WHAT IT SETTLED. All against snapshot 267915ba4f708fc9, one public IP, 24h each, ~1.76M flows. RUN HEALTH WAS PERFECT AND THAT IS THE HEADLINE: unmatched 0 on all 22, 84,977/84,977 rules loaded on all 22, input_status complete on all 22, no run flagged unsound. The tuple-normalisation work of steps 6-7 holds on real traffic at a scale no fixture approaches. COMPOSITION of 338 source entries: 13.6% direction-inverted (#115), 5.0% observational (#117), 75.4% inbound scan/probe, 5.9% specific CVE exploit attempt. BY SOURCE: pawpatrules 318, et/open 20, and the other seven feeds produced NOTHING — which is them working, since an uncompromised host should not hit an IOC feed. CONVERGENCE: the last 8 captures added ZERO new sids. Sixteen rules account for everything on this host, so more captures of the same profile will not teach much more. What would: a host behind NAT, one with outbound user traffic, or one suspected of compromise. NOTE the .dev rules only fired on the ONE capture with near-MTU packets and real payload — a scan-only corpus would have hidden #117 entirely."
  - "#118 IS CLOSED AS ANSWERED AND THE MEASUREMENT INVERTED ITS PREMISE — do not reopen without reading it. The question was whether a flow that never established should ever be verdict:malicious. Measured: EXCLUDING never-established flows would have deleted ALL TWENTY real exploit attempts and kept the 241 noise entries. The Realtek CVE-2021-35394 alerts are all conn_state S0 because they are UDP — one fire-and-forget packet, payload delivered, nothing replies. S0 does not mean for UDP what REJ means for TCP. Payload is a better axis and still not sufficient: it separates the #115 class perfectly (all 46 direction-inverted entries carried none) but would drop legitimate payload-free detections like Masscan and TELNET brute-force scan rules. The discriminator is DIRECTION corroborated by payload, which is #115."
  - "A MEASUREMENT ERROR I MADE AND CAUGHT, worth carrying because it nearly shipped a recommendation. The first #118 pass keyed on conn.log `orig_bytes` and reported the Realtek exploits carried NO DATA. Zeek writes `orig_bytes: -` on a single-packet UDP flow; my code turned `-` into 0. The raw record says history:D and orig_ip_bytes:144, so the payload is real. Had I stopped at that table I would have recommended deleting the twenty most valuable labels in the corpus. What caught it was the number being IMPLAUSIBLE — a UDP command-injection exploit carrying zero bytes — not any test. TWO RULES FOR ZEEK LOGS: `-` is not zero, and conn_state means different things for TCP and UDP."
  - "CAN RULE CLASSIFICATION BE AUTOMATED AT REFRESH? Measured 2026-08-17 across two snapshots two days apart, because Craig asked. SIDS ARE STABLE: 1,144 added, 1,469 removed, 83,833 unchanged, and only 4 msg changes — all cosmetic rewordings of the same rule. So a sid denylist does NOT rot in the means-something-else sense; it is safe. But churn is ~570 rules/day and a denylist is blind to every rule that arrives after it is written. THE EMOJI CONVENTION IS STABLE TOO: 0 markers changed on any surviving sid, no new markers, 18 distinct. But it separates OBSERVATIONAL from DETECTION, not FALSE POSITIVE from TRUE POSITIVE — sid 3319964 is a 🚨 detection rule that is a false positive for a direction reason no ruleset analysis can see. THREE LAYERS, and they answer different questions: (1) admission-time from rule text, fully automatable, re-derives every refresh — the machinery EXISTS, sid_index.json schema 3 already stores per-sid address_indicator for 16,068 sids; (2) match-time from the alert and the flow — direction, conn_state — not classifiable at refresh at all; (3) control captures, which CANNOT produce a classification and can only validate one, and note 22 captures exercised ~16 of 84,977 rules so they can never validate the other 99.98%. RECOMMENDATION if this is picked up: parse the marker at admission, store the class per-sid, AND assert marker-set stability so a convention change is loud. Get more than two days of marker history first."
  - "tools/triage.py IS HOW A BATCH IS RUN, and it is not a gate — corpus_gate.py is the gate. Usage: `uv run python tools/triage.py <capture-dir> --output-dir <dir> --jobs 8`, or `--report <dir>` to re-read a summary. NAME THE OUTPUT DIRECTORY AFTER THE SNAPSHOT: mixing snapshots makes the prevalence column meaningless and the tool blanks it and says why. THE ONE HEURISTIC: `caps` = how many captures a rule fired on. EVERY (>=2/3) usually means it describes the internet rather than the traffic; `one` is where findings are. It needs about ten captures to mean anything and it reversed two calls at four. Craig runs this himself now. Captures live in ../pcap-labeling/test-caps and CANNOT be committed — real addresses — so the class of error they find still has NO STANDING GATE, which is the strongest argument for #117 and for a second corpus."
  - "THE EICAR ROUTE TO THE MALICIOUS CANARY IS A DEAD END — measured 2026-08-13, do not re-explore. The hypothesis was that tests/fixtures/benign-corpus/smb-eicar-file-segmentation-random.pcap (MIT) could serve as the malicious canary if ET Open's three EICAR rules were admitted past the metadata filter. The filter was never the blocker. Grepping all nine mirror payloads for both the EICAR ASCII string and its hex encoding: ET Open is the ONLY feed carrying any EICAR rule, and none of the three enabled ones detects EICAR as such. 2022932 and 2022933 are `alert http`, to_client, and require a Symantec MIME name-overflow shape (Content-Type: ... name=\"<78+ chars>\"); 2039680 is `alert http` and requires an x-powered-by: Kaspersky Labs response header plus filename=\"eicar.zip\". The fixture is SMB. The one rule that did match the raw string, 2012591, is `# ET DELETED` upstream and also demands an MZ header. So even with the filter lifted, nothing could fire — and the fixture would have had to leave the benign corpus, which 11d asserts produces zero labels."
  - "SUPERSEDED 2026-08-15 — 11c merged as #100 and 11d as #101, so PLAN step 11 is complete and the residue is now PINNED by the corpus gate rather than open. Kept for the decision record it carries (the two wrong IOC definitions, the warn-and-downgrade call, why both halves of the composition are needed). ORIGINAL TEXT FOLLOWS. #75 IS STILL THE LIVE LABEL-QUALITY DEFECT, AND 11a ONLY BECAME REAL ON 2026-08-14. Read that first: the exclude_classtypes mechanism merged in #78 but sources.toml never got the table, so it was inert until #83. Measured with it in force: 84,995 admitted (436 fewer, exactly the policy-violation count) and the 17-capture corpus at 12 labels / 21 source entries. WHAT REMAINS. Steps 11a and 11b are merged (PLAN.md step 11 has the full plan). 11c is NOT started and it touches provenance.build_source_entry — the single place a Detection becomes provenance, pre-placed before steps 7 and 8 (#44) so two worktrees could not each invent label_basis. The rule it must implement, which took TWO wrong definitions to find: a SourceEntry is indicator-reference if EITHER the source class says so OR the rule is an address indicator. Both halves are needed — abuse.ch/urlhaus is the canonical ioc-name source and scores 0% on the per-rule test because a domain indicator is matched in payload content, while pawpatrules declares itself signature and holds 16,064 address indicators. THE DECISION IS TAKEN (Craig, 2026-08-13): when load_address_indicators returns None — the snapshot recorded no classification — the run WARNS AND DOWNGRADES. It proceeds, records the fact once in the run block's warnings[] naming the snapshot, and every SourceEntry takes indicator-reference rather than direct. That strands no snapshot and cannot reproduce #75; the error it risks instead is understating a genuine direct detection, which is the safer direction. Rejected: refusing to label (strands every pre-#79 snapshot, and load_address_indicators' own docstring argues for it — noted and overruled), and warning while labelling direct (reproduces #75 exactly with only a warning saying so). Carry into the build: build_source_entry is per-detection and pure, so it cannot itself write a once-per-run warning — expect 11c's file list to grow src/flabel/cli.py. 11d (the corpus vs real feeds gate in feeds.yml) waits on 11c and on the three residual causes in #75. ALSO SETTLE #93 BEFORE 11c: is_address_indicator returns True for a rule naming no address at all, and 11c is what turns that classification into a published label_basis."
  - "SUPERSEDED 2026-08-15 — step 10 wired it (feeds.yml), #101 added the broad corpus half, and #107 both unbroke it and closed the 'depends on someone remembering' hole with a liveness gate. Kept for the rejected alternatives, which still stand. ORIGINAL TEXT FOLLOWS. GOAL 5 IS PASSABLE BUT STILL NOT WIRED — the top open CI gap. Re-measured 2026-08-12 against a freshly built full-scale snapshot (8c9e8d58af0a8d64, 85,431 rules): the canary produces 0 detections, independently confirming the #42 fix. DECIDED (Craig, 2026-08-12, recorded on #24): wire it as a SCHEDULED feeds workflow, separate from PR CI, which fetches the nine feeds, builds a real snapshot and fails the build on any label. Rejected: caching a CI-built snapshot for the PR path (puts a network fetch in the PR critical path, and a cache miss silently skips the gate) and committing a reduced snapshot (a curated subset stops being the standing FP review for the 21,464 ungated pawpatrules rules, which is the whole point). Step 10 owns it; until it lands the review depends on someone remembering."
  - "RESOLVED 2026-08-12 (recorded on #23): tool_failures[] goes in a separate run.json in a run directory with NO labels.json. spec §11 required the failure recorded and §13 forbids a partial labels.json, so the array moved to a document that may exist. Rejected stderr-only (a script would parse prose to learn what was lost, discarding the argv/exit code/kill status that ToolError.failures exists to carry) and a complete labels.json with empty labels[] (reads as 'nothing malicious found' when the pipeline died). run.json is written by every run so there is one place to find the run block; step 10's reproducibility gate must skip label-free directories. spec §10 and §12 updated."
  - "The feed mirror behind every measurement above is at ../pcap-labeling/feed-mirror-2026-08-12/ — OUTSIDE this repo and outside version control, with no backup. 7.6 MB, nine as-fetched payloads, verified reproducing snapshot 8c9e8d58af0a8d64 from its new location. It cannot be committed (mixed GPL-3.0 / CC-BY-SA third-party rule text in a public repo) and it is not regenerable: urlhaus and two pawpatrules companion lists refresh upstream daily, so a later fetch is a different measurement. Its README records what it proves."
  - "RESOLVED 2026-08-12: the benign canary tripped pawpatrules 3300303: make_canary.py generates cleartext HTTP to port 443, which that rule legitimately flags. The fixture is at fault, not the feed — a canary whose whole point is that zero labels is known-correct must not contain anomalous traffic. Fixed in #42: flow 2 moved to port 80 and the fixture regenerated. The fixture was at fault, not the feed."
  - "Reproducibility has a shelf life: the apt repos serve only newest-patch, so Dockerfile.toolchain will eventually stop being rebuildable and the pinned toolchain survives only as the GHCR image pinned by digest in ci.yml. Decide before Step 10 wires the Goal 2 gate whether to mirror the .debs/image or accept the bound in writing."
  - "provenance.py carries a second import block mid-file under noqa: E402, an artifact of the append-only rule while steps 7 and 8 were built in parallel. Both are merged, so the constraint is gone — #64 folds them into the top block. Cosmetic, but the file does not read like any other module until it is done."
  - "ci.yml's toolchain digest is updated by hand after the toolchain workflow publishes, so it can silently lag behind Dockerfile.toolchain — CI would keep running an older toolchain with every test passing, because the pins and the old image still agree. Known weak link, not an oversight."
  - "No LICENSE file. Deliberate (Craig's call, 2026-08-12) while JA4+ licensing is with Legal — the repo is public but unlicensed. Not a scaffold defect; do not re-flag."
  - "RESOLVED 2026-08-12: README rewritten in full (Craig asked for a real pass, not a patch). It had claimed Pre-research with no working code, an unsettled labels.json schema, and — the worst of it — that detections come from replaying the capture past inline inspection and from matching JA3/JA4 fingerprints against high-trust feeds. The first is Phase 2 and unbuilt; the second was explicitly rejected in research and is now spec §2.6, a computed fingerprint is never a verdict. Its `there is no working end-to-end command yet` line was corrected in step 9, which made it false."
# --- Phase 1 sign-off, 2026-08-14 -------------------------------------------------------------
# Craig's call, recorded rather than implied. Sign-off asserts TWO things and not a third:
#   1. Phase 1's scope is delivered — PLAN.md's Definition of Done is met.
#   2. The known gaps are recorded and owned, not silently absent.
# It does NOT assert the code is defect-free. Five review rounds ran on 2026-08-14 and every one
# found real defects that CI could not see; a sign-off conditioned on "no more defects" would
# never happen, and the backlog is the correct home for what remains.
