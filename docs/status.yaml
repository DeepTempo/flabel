  - "2026-08-12 #56 fixed before step 9 (PR #66, open). correlate() scanned every flow for every detection: measured 50k flows x 5k detections at 0.02s indexed against ~58s for the old scan, extrapolated from a 100-detection sample. Flows are indexed once under BOTH tuple orientations, which is what _same_tuple established by comparing; the ICMP counterpart needs no second index because it is computable from the detection alone. Candidates de-duplicate by uid — without it a symmetric tuple yields one flow as two candidates, sending an exact match to the clock and turning it into ambiguous_flow_match, i.e. a speedup that silently loses labels. _same_tuple is kept as the reference the index is checked against across 13 disagreement cases"
