log:
  - "2026-08-24 THE SEAM IS PROVEN ON THE BOX, and it is the first time anything in Phase 3 has run outside a test. flabel-deploy ran for real: git pull, uv sync --extra db, `flabel-db verify` -> `flabel matches the declaration (5 tables)`, conditional install. A second run correctly printed `not reinstalling`. Then a benign-canary run through the DEPLOYED wrapper went flabel-run -> tarball published -> flabel-ingest -> rows, exit 0, and re-indexing the same tarball answered `already in flabel_scratch; nothing to do`. Three fixes were validated outside their own tests by this: the #172 PATH fix (the default `uv run --no-sync flabel-ingest` resolved), the #172 word-splitting override (FLABEL_RUN_INGEST carrying `--dataset flabel_scratch` worked), and LS-2 pre-deploy gate reading GCP_PROJECT from flabel.env. The busy guard also cleared using the REAL pgrep with the production pattern, which is the process-group rewrite validated on a real box"
  - "2026-08-24 THE DEPLOYMENT CLONE WAS 12 COMMITS BEHIND — /opt/flabel/repo sat at bf86bc8 (#141) with NO src/flabeldb and NO tools/flabel-deploy, and /usr/local/bin/flabel-run was the stale wrapper by md5. That is exactly the failure LS-2 exists to prevent (spec 7.5 records it at TWO merges; it was twelve). A BOOTSTRAP WRINKLE worth knowing: flabel-deploy cannot deploy itself the first time, because it does not exist in the clone yet — one `git pull` by hand in /opt/flabel/repo, then it takes over. /opt/flabel/repo and flabel.env are owned by bigdaddy, not root, so only the install into /usr/local/bin needs privilege"
  - "2026-08-24 GCP_PROJECT NOW LIVES IN /var/lib/flabel/flabel.env, read from the metadata server and never committed. It had NO OWNER — both wrappers named it when missing and nothing made it exist, the same shape as #163 — and the first flabel-deploy run is what surfaced it, its own gate being unable to resolve a project. docs/label-store-provision.md 7 said `.env does not exist on the box, so GCP_PROJECT is not in the environment`, which was true when written and is now superseded; corrected in place rather than deleted"
  - "2026-08-24 #142 IS DEFERRED BY CRAIG until Phase 2 live replay is buttoned down. Observed end to end on the benign canary: Suricata loaded 84,958 of 84,960 admitted rules, 2 skipped, so NO tier was attested and flabel-ingest said so — the rows loaded, authoritative_runs returned 0 for the run, and nothing was superseded. That is 2.4 working exactly as designed rather than a fault, but it means every tier-2 run until #142 is fixed contributes rows that will never become current, and LS-7 blfile will have no real tier-2 data behind its cross-tier composition path — only fixtures"
  - "2026-08-24 THE ja4 ZEEK PACKAGE IS NOT INSTALLED ON fl-replay. The run warned: `no flow will carry a JA4 fingerprint. Labels are unaffected — a fingerprint is never a verdict (spec 2.6) — but a missing ja4 in this run output means not computed, not no TLS`. The CI toolchain container installs it (Dockerfile.toolchain pins zeek/foxio/ja4 by tag AND commit); the box does not. So flow_labels rows written from this box carry null ja4/ja4s, and that absence means unmeasured rather than absent"
  - "2026-08-24 THE ENG-REVIEW IS NOW A GATE BEFORE THE PR, not after the merge (Craig). LS-5 met every other item on the definition of done, merged as #169, and was reviewed afterwards — and that review found the CRITICAL in #171. CLAUDE.md gains an explicit order of work on a step and the plan definition of done is ordered rather than a set. Two riders learned the same day: never review your own work, and VERIFY THE REVIEWER. The report that correctly found #171 also claimed files were on main when they were only uncommitted locally, the agent having no git access; and a later pair of reviews BOTH raised the same CRITICAL that measurement then disproved"
  - "2026-08-24 `uv run` DOES NOT PRUNE THE db EXTRA, and two independent reviews said it did. Measured: `uv sync` is EXACT and `uv sync --dry-run` without the extra reports `Would uninstall 25 packages` including google-cloud-bigquery; `uv run` is INEXACT with `--exact` opt-in, so it adds what is missing and prunes nothing — `uv run flabel` and `uv run flabel-db` both left the extra intact. So --no-sync buys a skipped re-resolve, NOT rescue from a destroyed venv, and the labelling call is correct as a plain `uv run`. The false reason had already reached a comment, a commit message, a PR body and spec 7.5 before measurement; all four corrected"
  - "2026-08-24 #170 REVIEW FOUND A CRITICAL OF THE SAME SHAPE AS #171, in code I had just written after fixing #171: tools/flabel-deploy passed no --project and sourced nothing, so flabel-db verify — the pre-deploy gate, the whole reason verify lives in a deploy script rather than CI — would have failed 100% of the time on the box, reported `verify reported drift ... a real finding, not a flaky gate`, and sent the operator to run apply against live production over a problem that did not exist. GCP_PROJECT is not in the box environment (label-store-provision.md 7) and sudo strips it besides. Fixed: environment first then flabel.env, checked BEFORE the pull so a missing project costs nothing, and verify exit codes are now read apart — 1 drift, 2 could-not-run, 3 defect — because only the first says anything about the dataset"
  - "2026-08-24 `install` DOES NOT OVERWRITE IN PLACE, measured: it unlinks and creates a NEW INODE — the inode number changes and a hardlink keeps the old contents — which is why it can replace a running binary where cp gets ETXTBSY. A running bash holds its descriptor on the old unlinked inode and reads it to completion. The claim that it does overwrite in place was the stated justification for the busy guard in spec-label-store 7.5, a script header and three test docstrings, and nothing had measured it. The guard is still right; the real hazard is bigger — a deploy git pulls source a running run imports lazily and uv sync PRUNES the venv that run is executing out of"
  - "2026-08-24 LS-5 MERGED (#169). tools/flabel-run carries the original gs:// argument as --source-uri (captured before the staging block reassigns TARGET) and calls flabel-ingest after a successful publish; exit 5 = published-not-indexed, documented in spec §12 beside exit 4. THE DEFECT ITS TESTS FOUND, do not re-introduce: publish() returns 0 BOTH when it publishes AND when it DECLINES a run with no labels.json, so `if publish; then index` indexed a run whose tarball was never written — the wrapper sets PUBLISHED on the success path only and indexes on that. The owed BigQuery test landed too: an empty labels[] that attests a tier TAKES that tier, so a capture since found clean stops reading as malicious, and the superseded flow_labels rows survive as a record. Its guard-the-guard line is `clean.run[tiers_attested] == [2]` — a run that attests nothing supersedes nothing, and without that line the whole test passes for the wrong reason. MEASURED, not merely written: `uv run pytest -q --bigquery tests/test_flabeldb_live.py` -> 21 passed in 183.19s against flabel_scratch on fl-replay 2026-08-24, up from 20. CI cannot run it (no GCP credential), so this line is the only evidence it was ever executed — an unexecuted live test and a passing one are otherwise indistinguishable from the repo"
  - "2026-08-24 LS-2 pgrep GUARD: THE SCRIPT MATCHES ITSELF, and pid filtering is not enough. The busy pattern is `tcpreplay|flabel|uv run` and the script is called flabel-deploy, so `pgrep -af` finds it. Dropping $$ and $PPID leaves a THIRD kind of self-match: command substitution FORKS, and the child carries a DIFFERENT pid with an IDENTICAL cmdline — measured, `pgrep -af probe-deploy` inside $( ) reported 344033 AND 344034, both `/bin/bash ./probe-deploy`. A pid-only filter therefore makes the guard fire on every invocation and the deploy can never run. The guard also drops any line naming the script; the accepted cost, stated rather than hidden, is that a concurrent second flabel-deploy is invisible to it — that wants a lock, not a pattern"
  - "2026-08-24 SABOTAGE FOUND TWO INERT GUARDS AND FOUR WEAK TESTS IN LS-2, none of them visible by reading the diff. `install -m 0755`: removing it left the test green because 0755 is install(1) OWN DEFAULT — the honest sabotage is -m 0644. The `[ -f $INSTALL_TO ]` before the md5 compare: the expected break was `the first deploy on a fresh box fails` and it does NOT, because set -e is SUPPRESSED INSIDE AN `if` CONDITION, so the failing md5sum yields an empty string and the install proceeds — what the guard actually buys is that a successful first deploy does not print an md5sum error to stderr, which the test now pins. And #136 trap on four tests: each stated its claim as `does not proceed to X` but asserted the EXIT CODE first, so the plan own sabotage returned a bare `assert 0 == 1` while saying nothing about the pull and sync that had already run. Commands-first now"
  - "2026-08-24 LS-5 MOSTLY BUILT, no PR yet. tools/flabel-run carries the origin URI and indexes after publishing. The --source-uri fix is the one the requirement rests on: a gs:// capture is staged and TARGET is then reassigned to the local path, so run.input.path recorded the STAGED path and the bucket URI was discarded with the shell variable — spec §6.1 says without it the requirement cannot be met at all. Only a gs:// argument becomes a --source-uri, because provenance derives uri_status as `gs if source_uri else local` and a local path would assert an origin that is false. Exit 5 (published, not indexed) is documented in spec §12 beside exit 4, on the same reasoning: reusing 1 tells a batch caller to discard a capture that SUCCEEDED"
  - "2026-08-24 A DEFECT THE LS-5 TESTS FOUND WHILE THE WIRING WAS BEING WRITTEN: publish() returns 0 in two different situations — it published, and it DECLINED because the run wrote no labels.json, which is not a result. An `if publish; then index` cannot tell those apart, so the first version indexed a run whose tarball was never written and flabel-ingest would have fetched an object that does not exist. The wrapper now records what it ACTUALLY published (PUBLISHED, set on the success path only) rather than reading the exit code"
  - "2026-08-24 A PROCESS FINDING WORTH MORE THAN ANY SINGLE BUG THIS SESSION: three separate mistakes all had one shape — VERIFYING WITH SOMETHING ADJACENT TO THE GATE RATHER THAN THE GATE. `ruff check .` alone when CI runs check AND format --check; `bash -c` to pipe-test a hook that actually runs under dash, where `set -o pipefail` is an illegal option; and reading PIPESTATUS[0] (echo's status) when the interesting element was [1]. A fourth variant: committing after a lint run that printed `Found 4 errors`, because the commands were separate lines rather than an && chain. Same family as the five sabotage escapes, which were all tests passing for a reason adjacent to the one they claimed. Verify with the gate's own command, chained so a failure stops"
  - "2026-08-24 LS-4 MERGED, Phase 3a is 4 of 7. flabel-ingest fetches a published tarball, parses it, attests its tiers and loads the five tables with `runs` LAST. Proven against the WHOLE archive rather than fixtures: 25 tarballs ingested into a truncated flabel_scratch, a second full pass ingesting 0 and reporting 25 already present, 1,870 flow_labels rows, 25 distinct run_ids with zero duplicates, and authoritative_runs resolving 25 runs to 17 because three captures were labelled more than once. That second-pass result is LS-8's stated acceptance property, arrived at early"
  - "2026-08-24 SPEC §5.3 STEP 3 CONTRADICTED ITS OWN STEP 2, found by driving the recovery path against the live service and not by reading it. Step 2 deletes the run's rows from every table unconditionally, because a new run and a half-loaded run are indistinguishable. Step 3 then said a job that `exists and succeeded means this table is done` — after step 2 it does not. Measured: flow_labels ended a recovery with ZERO rows, cleared by step 2 and skipped by step 3, with the runs commit marker landing on top of the emptiness, which is the failure the ordering exists to prevent reached from the other direction. Root cause is §10 M1 generalised — A JOB ID IS PERMANENT, so `this id succeeded once` says nothing about whether its rows are there NOW. Step 3 now loads every table under the first UNUSED id. next_attempt is kept with the old semantics and nothing calls it, because the difference between the two walks IS the finding"
  - "2026-08-24 §7.4 GUARD 4 HAD NEVER BEEN IMPLEMENTED, despite being named in LS-4's scope. A duplicate run_id means the commit marker landed twice so every read joining through it doubles, and guards 1-3 cannot notice that about themselves — an idempotency guard that has failed is by definition not running. It is a query over the data now, inside flabel-db verify, reporting zero across the 25-run backfill. AND ITS OWN SABOTAGE ROUND CAUGHT THE SAME TRAP ONE LEVEL UP: deleting the call from _verify left all 127 tests green, so the guard that proves other guards are connected was itself tested and unwired. There is now a test that verify actually runs it"
  - "2026-08-24 A CAPTURE ROW HAS NO run_id, found only by running the real thing. clear_orphans deleted WHERE run_id = @run_id from every table in LOAD_ORDER and captures declares observed_by_run_id instead, because a capture row is a SIGHTING (§4.2). BigQuery answered 400 Unrecognized name: run_id and the ingest exited 3 having loaded nothing. Nothing pure could have caught it: the column list is in schema.py, the SQL was in ingest.py, and neither module reads the other. RUN_COLUMN now names the column per table and a test joins it to the declaration. Two things the failure said for the design though — the exit code was 3 and not 1, so it read as a defect in the tool rather than a run that would not ingest, and it failed BEFORE any load so nothing partial landed"
  - "2026-08-24 THE flabel DATASET IS PROVISIONED, closing #163 — an item NO STEP OWNED. Five tables and authoritative_runs created by `flabel-db apply`, all empty, and `verify` then exits 0. It mattered because LS-2 ships verify as a PRE-DEPLOY GATE and that gate exited 1 against an empty flabel, so landing LS-2 first would have shipped a deploy script that refuses to deploy. LS-6 had already removed the hard part by measuring that apply needs only dataEditor and not dataOwner, so this was one command by the instance SA"
  - "2026-08-24 #159 NO LONGER REPRODUCES AND IS NOT FIXED, which is a distinction worth keeping. `flabel-db show` against the now-provisioned flabel exits 0 and prints `the store holds no matching run`. The bug was never about an EMPTY dataset — it is about one whose TABLES ARE MISSING, where _show queries a non-existent table, the NotFound is not a credential failure, and the generic handler exits 3 printing `This is a DEFECT in flabel-db`. Provisioning removed the trigger from production and left the defect in the code; LS-2 will meet it the first time it provisions a new environment"
  - "2026-08-24 PLAN AMENDED for the three staleness items docs/label-store-provision.md §4 recorded and correctly declined to fix, being outside LS-6's file list. LS-6 read as though it CREATED the dataset (it already existed, from LS-3's live round trip on 2026-08-20, undocumented); it claimed LS-4's real tests need what LS-6 provisions (false — test_flabeldb_live.py REFUSES to run against flabel and defaults to flabel_scratch, which already existed, so what LS-6 gives LS-4 is verified GRANTS); and it took credit for `no GCS grant is needed`, which spec §7.2 had established. A FOURTH was found while amending: the LS-4 ⟂ LS-6 bullet in the parallelism section carried the same wrong reasoning a second time, so a reader who never opened the LS-6 section would still have got the wrong model. Struck through rather than deleted, because what the step got wrong is the point — it was verification, not provisioning"
  - "2026-08-21 LS-3 FIX LIST ITEMS 6-10 DONE, and the live round trip that would have caught both Criticals now exists: 16 requires_bigquery tests against flabel_scratch, green. verify no longer compares field lists only — it reports partitioning, clustering (order-significant, since clustering is hierarchical and not a set), descriptions, column ORDER at every level of nesting, and the dataset LOCATION. Order is the one apply cannot repair: update_table accepts a reordered schema, returns 200, and does not change the live order (measured), so apply NAMES a rebuild rather than claiming a fix, and one helper serves differences() and patch_plan() so the gate and the repair cannot disagree"
  - "2026-08-21 A CORRECTION TO MY OWN HANDOFF, measured rather than reasoned: BigQuery will not cluster flow_labels on zeek_uid at all — 400 The field specified for clustering cannot be found in the schema — because zeek_uid lives inside the flow STRUCT and clustering takes top-level fields only. verify's blindness was real and worth fixing, but that particular state was UNREACHABLE through the API, so the store's single named never-do was already guarded twice over: by Table.__post_init__ on the way in and by the service itself. The reachable clustering drift is a top-level column, which is what the live test now uses"
  - "2026-08-21 THE DECLARATION GUARD THAT MATTERED WAS MISSING, NOT MERELY UNTESTED. partition_field=`flow.ts_first` was refused and partition_field=`run_id` — a STRING — was accepted, with the IDENTICAL consequence of a table that cannot be created from its own declaration: one of two identical failures had been moved into CI and the other left at CREATE TABLE. Now the partition column must be DATE/DATETIME/TIMESTAMP and not REPEATED, clustering is capped at four and may not repeat a key, an empty column list is refused, and every declared type name is validated recursively. The tests that LOOKED like coverage re-implemented each guard's own logic in the test, so they passed whether or not the guard existed"
  - "2026-08-21 WHERE A GUARD LIVES IS LOAD-BEARING, and it is Critical 1 generalised. A Column is built by this declaration AND by client.from_bigquery reading a live table, so any strict check on Column fires on live data — which is exactly how a RECORD from tables.get raised `only a STRUCT may carry subfields`, uncaught, exiting 1 = EXIT_DRIFT. So the type-name check went on Table, which only the declaration builds (LiveTable exists to keep it that way), and a test now pins that an unknown type coming back from the live read is REPORTED AS DRIFT rather than crashed on. The day BigQuery ships a type this file has never heard of, verify must still work"
  - "2026-08-21 THE VIEW SABOTAGE MATRIX DID NOT COME OUT AS PREDICTED, and the difference is worth keeping. Running all five inversions against flabel_scratch: ORDER BY drops run_id — grep CAUGHT, behaviour passed; finished_at ASC — grep passed, behaviour CAUGHT; EXISTS for NOT EXISTS — grep passed, behaviour CAUGHT; UNNEST(tiers_attempted) — both caught; recency >= 1 — grep passed, behaviour CAUGHT. So three of five WERE invisible to a suite that only greps, which is why the behavioural tests were written — but the tie-break row means NO BEHAVIOURAL TEST CAN RELIABLY CATCH A MISSING TIE-BREAK: with it gone the engine still returned the expected run, because the sabotaged view is not wrong on every execution, it has merely stopped being a function of the data. Both suites stay, and the plan now says why instead of implying one supersedes the other"
  - "2026-08-21 THREE SMALLER LS-3 FINDINGS CLOSED: `show --run-id X --capture Y` silently dropped --capture and answered a narrower question than the one asked (argparse refuses the pair now, the treatment #132 gave the mode flags); --project and --dataset reach SQL by interpolation and CANNOT be parameterised — a dataset name is part of a table path, not a value — while apply's CREATE OR REPLACE VIEW runs as dataOwner, so both are now checked against ^[A-Za-z0-9_-]+$ before a client is built; and test_store_modules_are_all_accounted_for classified schema.py as pure while checking NOTHING, because FORBIDDEN_IN_PURE was only ever applied to src/flabel — schema.py could have imported google.cloud.bigquery or subprocess with the suite green, while its own docstring says purity is what lets CI check it without a credential. Sabotaged with import socket, confirmed red"
  - "2026-08-20 LS-1 VERIFIED AND MERGED (PR #155 -> 313d753). Phase 3a is 1 of 7. Suite green on main: 1333 passed, 5 skipped. The verify review blocked on two HIGHs and both were real"
  - "2026-08-20 VERIFY HIGH 1 — A GATE SILENTLY SHRANK AND THE COUNTER COULD NOT SEE IT. A test insertion landed BETWEEN `@needs_tshark @pytest.mark.requires_tools` and the function they decorated, so the new test stole both markers and test_multi_datalink_keeps_the_dominant_type_and_records_the_discards was left bare. Two protections went: those tests hard-fail rather than skip without tshark, and conftest's MINIMUM_TOOL_TESTS — which exists in its own words `to catch tests that stop EXISTING, which no skip is ever reported for` — saw a net change of about zero, because the step added two tool tests and unmarked one. A COUNT IS THE WRONG SHAPE FOR A SWAP. Fixed with a gate that asserts the property, and getting the predicate TRUE took three attempts whose failures were the useful part: `calls normalize()` over-fired on THIRTY tests because most of that module drives normalize down paths that raise before any subprocess; `uses the multi-datalink fixture` over-fired on TWO, both legitimate — one raises before editcap and the other EMPTIES PATH on purpose so marking it would be actively wrong; and the gate flagged ITSELF, its own source containing the literals it searches for. The predicate that is true: uses the fixture AND does not expect an exception"
  - "2026-08-20 VERIFY HIGH 2 — snaplen ERASED THE FACT IT EXISTED TO EXPOSE, and no test could have caught it. Measured: mergecap of a 96-snaplen and a 65535-snaplen file yields interfaces declaring both, and publishing the LARGEST asserted a coverage the file does not have (half the packets capped at 96) while hiding the disagreement — the one thing the field was added for, since Zeek refuses a merge across differing snapshot lengths. Now snaplens: [int], the distinct set ascending (Craig). link_type stays SINGULAR deliberately: after normalisation a pcap can hold only one, so the retained type is genuinely one fact. THE REASON IT SHIPPED WRONG: every IDB in make_awkward.py used the default 65535, so max could have been min or matching[0] with the whole suite green. A fixture whose interfaces disagree is what made the finding testable at all"
  - "2026-08-20 THE TEST I WROTE TO PREVENT A CREDENTIAL LEAK CAUGHT MY OWN LEAK. --source-uri validation now enforces GCS's OWN rules (bucket syntax, the 1024-byte object cap, no control characters) rather than invented ones — it still accepts .., ?, @, spaces and non-ASCII in object names, which are all legal GCS names, because refusing them would look rigorous while making the flag unusable. The bucket rule is what catches gs://user:secret@bucket/obj. And the fault message INTERPOLATED THE BUCKET, which for that input IS the secret — so the refusal would have put it on stderr and into CI logs. The check meant to prevent a leak was the leak"
