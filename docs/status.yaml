next_action: "PHASE 2 (TIER 1) IS MERGED (PR #128). `flabel <capture>` replays a capture past the VM-Series and labels from both tiers; --offline is unchanged and is now the mode that performs no network I/O. Measured 2026-08-17 on lax/capture_2026-07-08: 285 labelled flows of 19,890, 373 tier-1 detections, 915 threat logs written and 915 retrieved (no loss), and ONE FLOW CORROBORATED BY BOTH TIERS carrying a tier-1 and a tier-2 source entry on one label with best_tier 1. Q16 is ANSWERED and spec/PRD/README are amended to match: virtual wire is impossible in GCP, two-zone L3 works, and the original 5-tuple survives replay so correlate needed no change. WHAT PHASE 2 HAS NOT GOT, none of it hidden: tier1.py has NO tests and panw.py has none for its CLIENT methods (only the pure parsing is covered) — biggest gap, same species as #87; replay.py subprocess wrappers untested; the flabel-run wrapper on the replay box is not in the repo and both of the day's late bugs lived in that unguarded layer; spec §9 anticipates a looser Phase 2 unmatched threshold and none is set; the ja4 Zeek package is not installed on the replay box; the ±362s timestamp error bar has never met a capture that actually reuses a 5-tuple. PHASE 1, AND THIS IS THE PART #128 DID NOT RESTATE: the three false-positive classes found on real captures are ALL addressed — #113 scanner identification, #115 direction-inverted IOC rules (published, not suppressed), #117 observational rules (excluded at admission on the feed's own marker). WHAT IS LEFT IS NOT A FOURTH CLASS. It is #118's product question, which no admission policy settles: 75.6% of the corpus is correct observations of inbound scanning, and whether that belongs in malicious-flow ground truth depends on whether the labels train 'this host is being attacked' or 'this host is compromised'. RECOMMENDED NEXT, in order: #119 (measure_feeds.py has no test coverage and has now caused a real problem — see known_gaps — so it is no longer hypothetical debt), then #124 and #125 (both small, both from #115's review), then #94 and #77. Phase 2 follow-ups sit alongside these, not ahead of them."
