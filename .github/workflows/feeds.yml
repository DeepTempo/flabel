# Goal 5 against the real nine-feed ruleset — the standing false-positive review.
#
# WHY THIS IS NOT PART OF CI (Craig, 2026-08-12 — issue #24)
#
# The benign canary's whole value is that *zero labels is known-correct by construction*, and it
# is the only review the wholesale-admitted sources get: `pawpatrules` alone contributes 21,464
# rules through no per-rule false-positive gate. To be that review it has to run against the real
# feeds — but the test suite may never contact a rule feed (docs/spec.md §2.2), and a real
# snapshot is 124 MB (42 MB of `rules.rules` alone), far too large to commit.
#
# So it runs here, on a schedule, outside the PR path. Two alternatives were rejected and the
# reasons matter more than the choice:
#
#   * Caching a CI-built snapshot for the PR path — puts a network fetch in the PR critical path,
#     and a cache miss means either a slow fetch or a silently skipped gate. "A skipped suite
#     looks like a passing one" is the exact failure `--require-tool-tests` exists to prevent.
#   * Committing a reduced snapshot — a curated subset stops being the standing review for the
#     ungated rules, which is the entire point.
#
# OPERATIONAL CAVEAT, and it is a real one: **GitHub disables `schedule:` triggers after 60 days
# of repository inactivity.** For a research repo that goes quiet once Phase 1 ships, this review
# stops running and nothing announces it — the failure mode is indistinguishable from "it keeps
# passing". If flabel is dormant, re-enable it from the Actions tab, or trigger it by hand with
# `workflow_dispatch`, before trusting a green history.
#
# SINCE 2026-08-15 SOMETHING DOES ANNOUNCE IT (#88). `ci.yml`'s `feeds-liveness` job fails a push
# when this workflow has not *succeeded* within `feeds_liveness.MAX_AGE_DAYS`. That does not make
# the caveat above go away — nothing can assert "the review is running right now" from inside a
# workflow that is not running — but it does mean the silence ends the moment anybody pushes. The
# property is "you cannot merge a change while the standing review has been dark", which is the
# strongest thing available here. Read `tests/integration/feeds_liveness.py` before weakening it.
#
# WHAT THIS BUYS BEYOND THE PR SUITE: it catches feed drift. `abuse.ch/urlhaus` and two of
# pawpatrules' companion lists (`openphish`, `nrd_phishing_14day`) refresh upstream daily and are
# inside the `snapshot_id` hash, so the ruleset genuinely changes underneath us between runs. A
# rule added upstream today that fires on ordinary HTTP is exactly what this is watching for.
#
# WHEN IT FAILS, IT IS USUALLY THE FEED — NOT THE CANARY. The fixture is byte-pinned by
# `test_the_benign_canary_fixture_is_the_one_the_gate_was_measured_against`. Read the label's
# `sources[]` to find the sid and source, then decide whether the rule is wrong or the fixture
# is. Do not "fix" this by editing the canary; that was already wrong once (#42, sid 3300303,
# where the fixture *was* at fault and was corrected on its own merits, not to make CI green).
name: feeds

on:
  schedule:
    # 04:17 UTC daily. Off the hour because GitHub's scheduler is heavily contended on it, and
    # after the abuse.ch feeds' own daily refresh so the snapshot reflects the current day.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  # Failure files an issue — see the last step.
  issues: write

# WHY THIS IS HERE, AND WHY IT IS NOT COSMETIC (2026-08-15, issue #88).
#
# GitHub defaults a *container* job's steps to `sh -e {0}`, not `bash -e {0}`. On Ubuntu `/bin/sh`
# is dash, which has no `pipefail`, so step 11d's `set -euo pipefail` aborted at line 1 with
# "Illegal option -o pipefail" and exit 2. The FIRST scheduled run after 11d merged died there —
# before the canary reached its verdict, and before the corpus step ran at all. Goal 5's real
# review was dead for a day and the only reason anyone knew is that the failure path files an
# issue (#105).
#
# It shipped that way because nothing in the PR path executes this file: `ci.yml` runs the test
# suite, and a workflow's own shell is not something a test can reach. The gate for that gap is
# the liveness job in `ci.yml`, which refuses a push when this workflow has not succeeded lately.
defaults:
  run:
    shell: bash

jobs:
  canary:
    name: benign canary vs the live nine-feed ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # The same digest-pinned toolchain CI uses: this gate is only meaningful against the
      # engine the labels would really be produced by.
      image: ghcr.io/deeptempo/flabel-toolchain@sha256:52bd9f7cf2784a6f22fcabde851387eb0cb44e20ebdd8af31dcf145ee6ac313b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain the image ships
        run: cat /etc/flabel-toolchain.json

      - run: uv sync --locked --dev

      # The one network step in the whole project (spec §2.2). Everything after it is offline.
      - name: Fetch the nine feeds and build a real snapshot
        run: uv run flabel rules update --rules-dir .flabel/rules

      - name: Record what was admitted
        run: uv run flabel rules list --rules-dir .flabel/rules

      - name: Label the benign canary
        run: |
          uv run flabel --offline tests/fixtures/benign.pcap \
            --rules-dir .flabel/rules --output-dir canary-run

      - name: Goal 5 — any label is a false positive and fails the build
        id: canary
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, pathlib, sys

          runs = sorted(pathlib.Path("canary-run").iterdir())
          if not runs:
              sys.exit("no run directory was produced — the canary did not run")
          rundir = runs[-1]

          labels_path = rundir / "labels.json"
          if not labels_path.exists():
              # No labels.json means the run died (issue #23); run.json says why. That is a
              # failure of the pipeline, not a Goal 5 result, and must not read as "zero labels".
              run = json.loads((rundir / "run.json").read_text())
              sys.exit(f"the run wrote no labels.json — it failed. run block: {run['run']}")

          document = json.loads(labels_path.read_text())
          run = document["run"]
          labels = document["labels"]

          print(f"snapshot   : {run['ruleset']['snapshot_id']}")
          print(f"rules      : {run['counts']['rules_loaded']} loaded, "
                f"{run['counts']['rules_failed']} failed, {run['counts']['rules_skipped']} skipped")
          print(f"detections : {run['counts']['detections']}")
          print(f"labels     : {run['counts']['labels']}")

          # A ruleset that did not load proves nothing: zero labels from zero rules is not a
          # passing canary, it is an unrun one. Compared against what THIS snapshot admitted
          # rather than a constant — a fixed floor of 1000 would have accepted a 94% collapse of
          # an 85k ruleset and still printed "Goal 5 passed".
          admitted = run["ruleset"]["total_admitted"]
          loaded = run["counts"]["rules_loaded"]
          if loaded != admitted:
              sys.exit(
                  f"{loaded} of {admitted} rules loaded. The canary reviews only the rules that "
                  f"ran, so a partial load makes this a weaker review than it reports being."
              )

          # Measured 2026-08-12 across all nine feeds: 0 failed, 0 skipped. Zero is the only
          # value ever observed, because rules this engine cannot compile are excluded at
          # admission (spec §5). Any non-zero here is a surprise worth stopping for.
          if run["counts"]["rules_failed"] or run["counts"]["rules_skipped"]:
              sys.exit(
                  f"{run['counts']['rules_failed']} failed / "
                  f"{run['counts']['rules_skipped']} skipped at load. Expected zero of each."
              )

          # The review is only "standing" if every wholesale-admitted source is in it. A feed
          # dropped upstream, or an `enabled = false` creeping into sources.toml, would silently
          # shrink what is being reviewed while the gate stayed green.
          sources = run["ruleset"]["sources"]
          if len(sources) != 9:
              sys.exit(
                  f"{len(sources)} sources in the snapshot, expected 9: "
                  f"{sorted(entry['name'] for entry in sources)}"
              )

          if labels:
              for label in labels:
                  for source in label["sources"]:
                      print(
                          f"FALSE POSITIVE: {source['source']} sid {source['sid']} "
                          f"rev {source['rev']} — {source['threat']}",
                          file=sys.stderr,
                      )
              sys.exit(
                  f"{len(labels)} label(s) on the benign canary. Every wholesale-admitted source "
                  f"passes through no per-rule gate, and this is their standing review — read "
                  f"the sids above and decide whether the rule or the fixture is at fault. Do "
                  f"not edit the canary to make this pass."
              )

          print("Goal 5: zero labels on the benign canary against the live ruleset")
          PY

      # --- the broad review (PLAN step 11d, issue #75) ----------------------------------------
      #
      # The canary above is 14 synthetic packets carrying two cleartext HTTP flows, so it can only
      # ever exercise the rules that could match those. That narrowness is what let #75 hide: 23
      # captures of ORDINARY protocol traffic produced 100 malicious labels against the same
      # ruleset the canary called clean, every one of them from pawpatrules.
      #
      # This runs the committed corpus — 17 real protocol captures, MIT, from suricata-verify —
      # and fails on any source entry that is not already known and argued for in
      # tests/fixtures/benign-corpus/tolerated.json.
      - name: Label the benign corpus
        id: corpus_label
        run: |
          # Explicit rather than inherited: Actions defaults to `bash -e` on Linux, so a failing
          # capture already aborts the loop — but the abort is load-bearing (it is what stops the
          # gate reviewing a partial corpus) and a default that changes underneath is not a
          # contract. `pipefail` matters because the loop body may grow a pipe.
          set -euo pipefail
          for capture in tests/fixtures/benign-corpus/*.pcap*; do
            echo "--- $capture"
            uv run flabel --offline "$capture" \
              --rules-dir .flabel/rules --output-dir corpus-runs
          done

      # The decision lives in `tests/integration/corpus_gate.py`, not in this heredoc, and
      # `tests/integration/test_corpus_gate.py` proves it FAILS on a new offender. A gate whose
      # logic exists only inside a scheduled workflow is one nothing can prove is able to fail —
      # which is how the Goal 2 gate came to be hollowed out with CI green (#74), and how three of
      # step 13's fixes shipped with tests that passed against the unfixed code (#98).
      - name: Goal 5 broad — a new false positive on ordinary traffic fails the build
        id: corpus
        run: uv run python tests/integration/corpus_gate.py corpus-runs

      # Issue #117 keys an admission policy on an emoji in third-party rule text, which is a
      # convention and not an interface. This is the half that makes that defensible: it fails
      # the build if the feed stops writing the convention (the policy would then sit in the
      # registry excluding nothing, which is #75 all over again), if the count leaves its band
      # in either direction, or if a marker nobody has classified appears on an admitted rule.
      # It runs here rather than in PR CI because only this workflow has the live feed.
      #
      # AFTER the two false-positive reviews, deliberately. A failing step aborts the job, and
      # this one's likeliest failure is "upstream added an emoji" — a read-a-sample-and-decide
      # item. Running it first would take the benign canary and the corpus down with it, and
      # those are the only false-positive review the 21,464 ungated pawpatrules rules get.
      - name: The pawpatrules marker convention has not moved (#117)
        id: markers
        run: uv run python tests/integration/marker_gate.py .flabel/rules

      # A daily gate can be red for weeks with nothing but a badge to say so, and this one is
      # the only false-positive review the 21,464 ungated pawpatrules rules get. Failure files
      # an issue so it reaches a person.
      - name: File an issue if either review failed
        if: failure()
        uses: actions/github-script@v7
        env:
          # Which review failed, so the issue body names the right cause and the right file. A
          # step that did not run reports no outcome, so the fallbacks order themselves.
          FAILED_STEP: >-
            ${{ steps.corpus.outcome == 'failure' && 'corpus'
              || steps.canary.outcome == 'failure' && 'canary'
              || steps.markers.outcome == 'failure' && 'markers'
              || 'pipeline' }}
        with:
          script: |
            // Which step failed decides the diagnosis, and getting it wrong is worse than
            // saying nothing: before this, a corpus false positive or a mid-run pipeline error
            // filed an issue telling the operator not to edit benign.pcap — wrong file, wrong
            // instruction, for a failure that had nothing to do with the canary.
            const failed = process.env.FAILED_STEP || "unknown";
            const title = "Goal 5: the scheduled false-positive review failed";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const diagnosis = {
              canary:
                "An admitted rule fires on the NARROW canary — 14 synthetic packets that are " +
                "benign by construction, so any label is a false positive. Do not resolve this " +
                "by editing `tests/fixtures/benign.pcap`: it is byte-pinned for that reason.",
              corpus:
                "An admitted rule fires on ordinary protocol traffic that " +
                "`tests/fixtures/benign-corpus/tolerated.json` does not account for. This is " +
                "issue #75 recurring. The step log names the capture, source and sid. If the " +
                "label is fair, add it to that file WITH A REASON — do not delete a capture.",
              markers:
                "The emoji convention `pawpatrules` marks its rules with — which " +
                "`sources.toml` keys an admission policy on (#117) — has moved. The step log " +
                "says which way. If it now excludes NOTHING, the observational rules are being " +
                "admitted again and `go.dev` is a `verdict: malicious` label; if a new marker " +
                "appeared, read a sample and decide whether it detects or observes before " +
                "adding it to `KNOWN_ADMITTED_MARKERS` or to the registry. Do not silence this " +
                "by widening the known set without reading the rules.",
              pipeline:
                "The run did not complete, so neither review reached its verdict. This is a " +
                "pipeline or ruleset failure rather than a false positive — read the failing " +
                "step's log before reading anything into the labels.",
            }[failed] || "The scheduled run failed before either review reported.";
            const body =
              `The scheduled feeds run failed: ${url}\n\n` +
              `**Failing step: ${failed}.** ${diagnosis}\n\n` +
              `Both run directories are attached to that run as an artifact; \`labels.json\` ` +
              `names the source and sid, and \`run.json\` says what the run lost.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "goal-5",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["goal-5"],
              });
            }

      # Both reviews' output, because a failure names sids and the next question is always
      # "which flow, in which capture" — which only the run directory answers.
      - name: Keep the run directories for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feeds-runs
          path: |
            canary-run/
            corpus-runs/
          retention-days: 14
