# CI: lint on a plain runner, tests inside the pinned toolchain container.
#
# The container is the whole point. Zeek, Suricata and editcap are invoked for real in tests
# (docs/spec.md §2), so a bare ubuntu-latest runner cannot execute this suite — it could only
# skip it, which is precisely the failure mode --require-tool-tests exists to prevent.
#
# The image is pinned by digest, not tag. It is built by .github/workflows/toolchain.yml,
# which prints the digest to paste here.
name: CI
on: [push, pull_request]

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # spec §3 warns that package data can silently miss the wheel — hatchling honours
      # .gitignore, which carries broad *.log and zeek/ rules. Tests only prove resolution
      # from a checkout, which was never the failing mode.
      - name: Package data reaches the wheel
        run: |
          uv build --wheel -o dist
          python -c "
          import sys, zipfile, glob
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [p for p in ['flabel/data/sources.toml'] if p not in names]
          sys.exit(f'missing from {wheel}: {missing}') if missing else print('package data present')
          "

  test:
    runs-on: ubuntu-latest
    container:
      # zeek 8.0.9, suricata 8.0.6, wireshark 4.6.6, zeek/foxio/ja4 v0.18.8.
      # Built from Dockerfile.toolchain by the `toolchain` workflow; run
      # `docker run --rm <image> cat /etc/flabel-toolchain.json` to see what it ships.
      image: ghcr.io/deeptempo/flabel-toolchain@sha256:b22ae1a072f380323f93c4a1b3d2d2123ee285c6cff0d454d295a5a010c67946
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain the image ships
        run: cat /etc/flabel-toolchain.json

      # uv is baked into the image, so no setup action is needed here.
      - run: uv sync --locked --dev

      # --require-tool-tests: fail unless a real-tool test actually ran, so a skipped
      #                       integration layer can never be mistaken for a passing build.
      # --strict-toolchain:   tool versions must match [tool.flabel.toolchain] exactly and
      #                       the Zeek JA4 package must be present.
      - run: uv run pytest -q --require-tool-tests --strict-toolchain
