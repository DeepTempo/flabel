# CI: lint on a plain runner, tests inside the pinned toolchain container.
#
# The container is the whole point. Zeek, Suricata and editcap are invoked for real in tests
# (docs/spec.md §2), so a bare ubuntu-latest runner cannot execute this suite — it could only
# skip it, which is precisely the failure mode --require-tool-tests exists to prevent.
#
# The image is pinned by digest, not tag. It is built by .github/workflows/toolchain.yml,
# which prints the digest to paste here.
name: CI
on: [push, pull_request]

permissions:
  contents: read
  packages: read
  # feeds-liveness reads this repo's workflow-run history. Read-only, and the narrowest scope
  # that lets it ask when Goal 5's real review last succeeded.
  actions: read

jobs:
  # Goal 5's real false-positive review is .github/workflows/feeds.yml, and it runs on a
  # `schedule:` that GitHub disables after 60 days of repository inactivity. A workflow that is
  # not running cannot notice that it is not running, so the check has to live somewhere that
  # runs on every push — here.
  #
  # Cheap and outside the container on purpose: it is one API call and a comparison, it must not
  # wait on the toolchain image, and it must report separately from `test` so a dark review reads
  # as a dark review rather than as a test failure.
  feeds-liveness:
    name: Goal 5's real review has not gone dark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--paginate` is deliberately absent: 30 runs of a daily schedule is a month of history,
      # far more than the threshold needs, and an unbounded page count would turn a cheap check
      # into a slow one on a repo with years of runs.
      - name: Ask GitHub when the feeds review last succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/feeds.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | {conclusion, created_at}]' > feeds-runs.json

      # The decision lives in tests/integration/feeds_liveness.py, not in this step, and
      # test_feeds_liveness.py proves it FAILS on a stale review, on a review that only ever
      # failed, and on an API it could not reach. A gate whose logic exists only inside a
      # workflow is one nothing can prove is able to fail — #74, #98 and #101, three times.
      - name: Goal 5's real review must have succeeded recently
        run: python3 tests/integration/feeds_liveness.py feeds-runs.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `--extra db` for the store's PURE tests (schema declaration, drift detection,
      # credential-vs-drift exit codes). They call no BigQuery API — spec-label-store §2
      # records that the `requires_bigquery` tests run nowhere — but they import the
      # client's exception types, so the extra has to be installed for them to run at all.
      - run: uv sync --locked --dev --extra db
      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # spec §3 warns that package data can silently miss the wheel — hatchling honours
      # .gitignore, which carries broad *.log and zeek/ rules. Tests only prove resolution
      # from a checkout, which was never the failing mode.
      - name: Package data reaches the wheel
        run: |
          uv build --wheel -o dist
          python -c "
          import sys, zipfile, glob
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [p for p in ['flabel/data/sources.toml'] if p not in names]
          sys.exit(f'missing from {wheel}: {missing}') if missing else print('package data present')
          "

  # The suite must be green on a checkout WITHOUT the `db` extra, and this job is the only
  # thing that can notice. `uv sync` installs no extras, and `flabel` declares dependencies = []
  # deliberately, so no-extra is the DEFAULT state — yet both other jobs pass `--extra db`, which
  # made the one state worth guarding the one state nothing exercised.
  #
  # It caught a real defect the moment it existed. `importlib.util.find_spec` on a DOTTED name
  # imports the parent package to find its __path__ and RAISES when the parent is absent, instead
  # of returning None. Three test files spelled the extra's guard that way, so without the extra
  # the files did not skip — they failed to COLLECT, and the suite was red.
  #
  # Outside the container on purpose: the toolchain is irrelevant here and the requires_tools layer
  # is deselected, because what this job proves is about imports and collection, not about Zeek.
  # `test` above is what proves the tool layer.
  no-db-extra:
    name: Suite is green without the db extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No `--extra db`. That is the entire point of this job; do not "fix" a failure here by
      # adding it.
      - run: uv sync --locked --dev
      - run: uv run pytest -q -m "not requires_tools"

  test:
    runs-on: ubuntu-latest
    container:
      # zeek 8.0.9, suricata 8.0.6, wireshark 4.6.6 (editcap/capinfos/tshark), ja4 v0.18.8.
      # Built from Dockerfile.toolchain by the `toolchain` workflow; run
      # `docker run --rm <image> cat /etc/flabel-toolchain.json` to see what it ships.
      image: ghcr.io/deeptempo/flabel-toolchain@sha256:52bd9f7cf2784a6f22fcabde851387eb0cb44e20ebdd8af31dcf145ee6ac313b
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain the image ships
        run: cat /etc/flabel-toolchain.json

      # uv is baked into the image, so no setup action is needed here.
      # `--extra db` for the store's PURE tests (schema declaration, drift detection,
      # credential-vs-drift exit codes). They call no BigQuery API — spec-label-store §2
      # records that the `requires_bigquery` tests run nowhere — but they import the
      # client's exception types, so the extra has to be installed for them to run at all.
      - run: uv sync --locked --dev --extra db

      # --require-tool-tests: fail unless a real-tool test actually ran, so a skipped
      #                       integration layer can never be mistaken for a passing build.
      # --strict-toolchain:   tool versions must match [tool.flabel.toolchain] exactly and
      #                       the Zeek JA4 package must be present.
      - run: uv run pytest -q --require-tool-tests --strict-toolchain
