# Builds and publishes the CI toolchain image from Dockerfile.toolchain.
#
# Deliberately separate from CI: the image changes rarely, and every CI run should pull a
# fixed, already-built image rather than reinstalling Zeek and Suricata on each push.
#
# After this runs, copy the digest it prints into the `container:` line of ci.yml. Pinning
# by digest rather than tag is what makes the toolchain half of Goal 2 (reproducibility)
# real — a tag can move underneath a green build; a digest cannot.
name: toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile.toolchain
      - .github/workflows/toolchain.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and verified BEFORE it is pushed, so "published" implies "verified" and a
      # broken image never reaches the registry. The push step below reuses these layers
      # from cache, so this costs a load rather than a second build.
      - name: Build into the local daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.toolchain
          # amd64 only — the OBS Zeek repo has no arm64 build. See Dockerfile.toolchain.
          platforms: linux/amd64
          load: true
          tags: flabel-toolchain:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the suite inside the candidate image
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv \
            flabel-toolchain:candidate \
            sh -c 'uv sync --locked --dev && uv run pytest -q --require-tool-tests --strict-toolchain'

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.toolchain
          platforms: linux/amd64
          push: true
          # Immutable, commit-scoped tag only. No `latest`: a moving tag is exactly the
          # thing this workflow exists to avoid.
          tags: ghcr.io/deeptempo/flabel-toolchain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the digest and the versions it installed
        run: |
          image="ghcr.io/deeptempo/flabel-toolchain@${{ steps.build.outputs.digest }}"
          {
            echo "## Toolchain image published"
            echo
            echo "Pin this in \`.github/workflows/ci.yml\`:"
            echo
            echo '```yaml'
            echo "    container:"
            echo "      image: $image"
            echo '```'
            echo
            echo "Installed versions — these must match \`[tool.flabel.toolchain]\` in pyproject.toml:"
            echo
            echo '```json'
            docker run --rm "$image" cat /etc/flabel-toolchain.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
