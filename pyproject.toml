[project]
name = "flabel"
version = "0.0.0"
description = "Label malicious flows in unlabeled packet captures for detection-model training data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The store's dependencies, kept out of the base install so `dependencies = []` above stays
# literally true. `flabel` itself must remain installable with nothing, which is what
# tests/test_architecture.py asserts in both directions.
db = [
    "google-cloud-bigquery>=3.25",
    # `flabel-ingest` fetches the PUBLISHED tarball from gs:// rather than reading the local run
    # directory (spec-label-store §7.2), so that every ingested run is provably rebuildable and the
    # live and backfill paths share one source. The client library rather than `gcloud`: LS-6
    # measured that gcloud needs `sudo` on fl-replay because its credential store is per-user,
    # while a client library reaches the metadata server unprivileged — and rather than the raw
    # JSON API, so the identity comes from `client.credentials()` like everything else does
    # (spec invariant 7: the identity is named, never discovered).
    "google-cloud-storage>=2.18",
]

[project.scripts]
flabel = "flabel.cli:main"
flabel-db = "flabeldb.cli:main"
flabel-ingest = "flabeldb.ingest:main"
blfile = "flabeldb.blfile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A sibling directory is not packaged until it is named here.
packages = ["src/flabel", "src/flabeldb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.flabel.toolchain]
# Exact versions installed by Dockerfile.toolchain. This is the reproducibility contract
# for Goal 2 — identity across unpinned tool versions is meaningless (docs/prd.md §"CI
# toolchain container"). Tests assert major.minor by default so brew-based local dev works;
# CI adds --strict-toolchain to assert these exact strings. Bump them with the image.
zeek = "8.0.9"
suricata = "8.0.6"
wireshark = "4.6.6"  # supplies both editcap and capinfos
ja4_zeek_package = "v0.18.8"  # git tag of zeek/foxio/ja4; JA4+ under FoxIO License 1.1
# Tags are mutable and this package changes JA4 values on labels, so the resolved commit
# is pinned too. The image build fails if the tag ever stops resolving to it.
ja4_zeek_commit = "3ecddb5f1d0b92210535171a62901bf3d596c7b8"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: every gate mechanism keys on the literal marker name `requires_tools`,
#   so a typo like `require_tools` would produce a test that is neither skipped without the
#   toolchain, nor counted by the gate, nor noticed when deselected. Make it an error.
# -p pytester: test_tool_gate.py runs pytest-in-pytest to prove the toolchain gate fails
#   when it should. Loading the plugin only registers its fixtures.
addopts = "-ra --strict-markers -p pytester"
markers = [
    "requires_tools: invokes the real Zeek/Suricata/Wireshark toolchain (see docs/spec.md §2)",
    # Registered under --strict-markers so the live BigQuery tests are a real, selectable set
    # rather than a typo that silently never runs. They do NOT run in CI (no credential, and the
    # repo is public so no key may be committed) — they are run by hand on fl-replay against
    # `flabel_scratch`, which reaches the instance service account through the metadata server.
    # `flabel-db verify` is a pre-deploy gate for the same reason (spec-label-store §2).
    "requires_bigquery: talks to a real BigQuery dataset; run by hand on fl-replay, never in CI",
    # The `db` extra is NOT installed by a bare `uv sync` — flabel itself declares
    # dependencies = [] so that it has none. These tests import the BigQuery client's types
    # (no API call), so they skip without it. tests/conftest.py does the skipping, because
    # the detection is the part that was wrong: find_spec on a dotted name RAISES when the
    # parent is absent, which made the suite red on a checkout without the extra.
    "requires_db_extra: needs the `db` extra installed (google.cloud.bigquery)",
]
