[project]
name = "flabel"
version = "0.0.0"
description = "Label malicious flows in unlabeled packet captures for detection-model training data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
flabel = "flabel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flabel"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
